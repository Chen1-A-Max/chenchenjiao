<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Dual Desktop — macOS × Win98 Simulator</title>
<style>
/* =====================================================================
   RESET & BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit;outline:none;border:none;background:transparent}
img{display:block}

/* =====================================================================
   GLOBAL SWITCHER (Top Tab Bar)
   ===================================================================== */
#os-switcher{position:fixed;top:0;left:0;right:0;height:42px;z-index:99999;display:flex;justify-content:center;align-items:center;gap:0;background:#1d1d1f;border-bottom:1px solid #000;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#os-switcher .tab{padding:8px 22px;font-size:13px;font-weight:500;color:#b8b8b8;background:transparent;letter-spacing:.3px;transition:all .15s}
#os-switcher .tab.active{color:#fff;background:linear-gradient(180deg,#3a3a3c,#2c2c2e);box-shadow:inset 0 -2px 0 #0a84ff}
#os-switcher .tab:hover:not(.active){color:#fff;background:#2c2c2e}
#os-switcher .brand{position:absolute;left:18px;color:#86868b;font-size:12px;letter-spacing:1px}

/* =====================================================================
   DESKTOP LAYERS
   ===================================================================== */
.desktop{position:absolute;top:42px;left:0;right:0;bottom:0;overflow:hidden;display:none}
.desktop.active{display:block}

/* ===== macOS Desktop ============================================== */
#macos-desktop{
  background:linear-gradient(135deg,#1e3c72 0%,#2a5298 30%,#6a3093 70%,#cb2975 100%);
}
#macos-desktop::after{
  content:"";position:absolute;inset:0;
  background:
      radial-gradient(ellipse at 20% 80%,rgba(255,180,120,.15) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 20%,rgba(120,180,255,.2) 0%,transparent 60%);
  pointer-events:none;
}

/* macOS Menu Bar */
#mac-menubar{
  position:absolute;top:0;left:0;right:0;height:26px;
  background:rgba(20,20,20,.4);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  display:flex;align-items:center;padding:0 12px;font-size:13px;color:#fff;
  z-index:10000;border-bottom:.5px solid rgba(255,255,255,.15);
}
#mac-menubar .apple-logo{font-size:16px;margin-right:14px;cursor:pointer;padding:2px 6px;border-radius:4px}
#mac-menubar .apple-logo:hover{background:rgba(255,255,255,.15)}
#mac-menubar .menu-item{padding:2px 10px;margin:0 2px;border-radius:4px;cursor:pointer;font-weight:500}
#mac-menubar .menu-item:hover, #mac-menubar .menu-item.open{background:rgba(255,255,255,.2)}
#mac-menubar .menu-item.app{font-weight:600}
#mac-menubar .right-group{position:absolute;right:12px;display:flex;align-items:center;gap:14px;font-size:12px}
#mac-menubar .right-group span{cursor:pointer;display:inline-flex;align-items:center;line-height:1}
#mac-menubar .right-group svg{display:inline-block;vertical-align:middle}
#mac-menubar .battery{font-size:11px}

/* macOS Dropdown */
.mac-dropdown{position:absolute;background:rgba(40,40,42,.85);backdrop-filter:blur(20px);border:.5px solid rgba(0,0,0,.4);border-radius:6px;color:#fff;font-size:13px;padding:5px 0;min-width:220px;z-index:20000;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.mac-dropdown .dd-item{padding:5px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.mac-dropdown .dd-item:hover{background:#0a84ff}
.mac-dropdown .dd-item.disabled{color:#888;cursor:default}
.mac-dropdown .dd-item.disabled:hover{background:transparent}
.mac-dropdown .dd-sep{height:1px;background:rgba(255,255,255,.15);margin:4px 0}
.mac-dropdown .dd-shortcut{color:#aaa;font-size:11px;margin-left:24px}

/* macOS Desktop Icons */
.mac-icon-grid{position:absolute;top:40px;right:20px;display:grid;grid-template-columns:repeat(2,90px);gap:18px 8px;z-index:50;pointer-events:auto}
.mac-icon{position:relative;width:90px;display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:6px 4px;border-radius:6px;transition:background .1s;z-index:51;pointer-events:auto;user-select:none;-webkit-user-select:none}
.mac-icon:hover{background:rgba(255,255,255,.12)}
.mac-icon.selected{background:rgba(255,255,255,.25)}
.mac-icon .icon-img{width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:5px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.mac-icon .icon-img svg{width:64px;height:64px;display:block}
/* SVG 符号默认填充（防止 use 引用后没有颜色） */
.mac-icon .icon-img svg use{color:#fff;fill:currentColor}
.mac-icon .icon-label{color:#fff;font-size:12px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6);max-width:90px;word-break:break-all}

/* macOS Dock */
#mac-dock{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  background:rgba(220,220,225,.35);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.3);
  border-radius:18px;
  padding:6px 10px;
  display:flex;align-items:flex-end;gap:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.2);
  z-index:10000;
}
.dock-item{width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:12px;position:relative;cursor:pointer;transition:transform .15s}
.dock-item:hover{transform:translateY(-10px) scale(1.15)}
.dock-item .tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:rgba(50,50,55,.9);color:#fff;font-size:11px;padding:4px 10px;border-radius:5px;white-space:nowrap;margin-bottom:6px;opacity:0;pointer-events:none;transition:opacity .15s}
.dock-item:hover .tooltip{opacity:1}
/* ★ macOS Dock 最小化窗口指示：app 存在最小化窗口时，图标下方显示小圆点（点击可恢复） */
.dock-item.has-minimized::after{
  content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,0.95);
  box-shadow:0 0 4px rgba(255,255,255,0.7);
}
.dock-sep{width:1px;height:38px;background:rgba(255,255,255,.4);margin:0 4px;align-self:center}

/* ===== Window Frame (macOS) ======================================= */
.mac-window{
  position:absolute;
  background:#ececec;
  border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  min-width:300px;min-height:200px;   /* ★ 与缩放下限 MIN_W/MIN_H 保持一致 */
  display:flex;flex-direction:column;
  overflow:hidden;
  border:1px solid rgba(0,0,0,.15);
}
.mac-window.maximized{top:26px !important;left:0 !important;right:0 !important;bottom:0 !important;width:auto !important;height:auto !important;border-radius:0}
.mac-titlebar{
  height:38px;background:linear-gradient(180deg,#f6f6f6,#dcdcdc);
  border-bottom:1px solid rgba(0,0,0,.12);
  display:flex;align-items:center;padding:0 12px;
  cursor:grab;flex-shrink:0;
}
.mac-titlebar:active{cursor:grabbing}
.mac-titlebar .traffic-lights{display:flex;gap:8px}
.mac-titlebar .tl{width:12px;height:12px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(0,0,0,.55);font-weight:700}
.mac-titlebar .tl.close{background:#ff5f57;border:1px solid #e0443e}
.mac-titlebar .tl.min{background:#febc2e;border:1px solid #dea123}
.mac-titlebar .tl.max{background:#28c840;border:1px solid #1aab29}
.mac-titlebar .tl:hover{filter:brightness(1.1)}
.mac-titlebar .tl span{opacity:0;transition:opacity .1s}
.mac-titlebar:hover .tl span{opacity:1}
.mac-titlebar .title{flex:1;text-align:center;font-size:13px;font-weight:600;color:#333}
.mac-window-body{flex:1;overflow:auto;background:#fff;display:flex;flex-direction:column}

/* ===== Windows 98 Desktop ========================================= */
#win98-desktop{
  background:#008080;
}
#win98-desktop::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(45deg,rgba(255,255,255,.04) 25%,transparent 25%),
    linear-gradient(-45deg,rgba(255,255,255,.04) 25%,transparent 25%);
  background-size:8px 8px;
  pointer-events:none;
}

.win98-icon{
  position:absolute;
  width:75px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;padding:4px;z-index:50;pointer-events:auto;user-select:none;-webkit-user-select:none;
}
.win98-icon:hover .win98-icon-label{background:#000080;color:#fff}
.win98-icon.selected .win98-icon-label{background:#000080;color:#fff;border:1px dotted #fff;outline:1px dotted #000080}
.win98-icon-img{width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.win98-icon-img svg{width:32px;height:32px;display:block}
/* SVG 符号默认填充 */
.win98-icon-img svg use{color:#000;fill:currentColor}
.win98-icon-label{font-size:11px;color:#fff;text-align:center;text-shadow:1px 1px 0 #000;padding:1px 3px;font-family:"MS Sans Serif","Microsoft Sans Serif",Tahoma,sans-serif;max-width:75px;word-break:break-all}

/* Win98 Window Frame */
.w98-window{
  position:absolute;
  background:#c0c0c0;
  border-top:2px solid #fff;
  border-left:2px solid #fff;
  border-right:2px solid #404040;
  border-bottom:2px solid #404040;
  box-shadow:1px 1px 0 #000;
  min-width:300px;min-height:200px;
  display:flex;flex-direction:column;
}
.w98-window.maximized{top:0 !important;left:0 !important;right:0 !important;bottom:32px !important;width:auto !important;height:auto !important}

/* ===== 窗口自由缩放手柄（透明，只提供热区 + resize 光标）============
   .se = 右下角 16x16   .e = 右边缘 6px   .s = 底边缘 6px
   手柄放在内容之上（z-index:9），但不遮挡视觉，仅改变鼠标光标形状。 */
.win-rsz{position:absolute;z-index:9;background:transparent;touch-action:none}
.win-rsz.e {top:0;right:0;width:6px;height:100%;cursor:ew-resize}
.win-rsz.s {left:0;bottom:0;width:100%;height:6px;cursor:ns-resize}
.win-rsz.se{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
.mac-window .win-rsz.se{border-radius:0 0 10px 0}
/* 最大化时不显示缩放热区 */
.mac-window.maximized .win-rsz,
.w98-window.maximized .win-rsz{display:none}
/* 拖拽期间禁止选中文本，避免出现蓝色选区 */
body.wm-resizing,body.wm-resizing *{user-select:none !important;cursor:inherit}
.w98-titlebar{
  height:20px;background:linear-gradient(90deg,#000080,#1084d0);
  color:#fff;font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2px 0 4px;
  cursor:move;
  font-family:"MS Sans Serif","Microsoft Sans Serif",Tahoma,sans-serif;
}
.w98-titlebar .w98-title-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w98-titlebar .w98-ctrls{display:flex;gap:0}
.w98-btn{
  width:18px;height:16px;background:#c0c0c0;
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #404040;border-bottom:1px solid #404040;
  display:flex;align-items:center;justify-content:center;
  font-family:"Marlett",monospace;font-size:11px;color:#000;
  margin-left:2px;box-shadow:inset -1px -1px 0 #808080;
  cursor:pointer;
}
.w98-btn:active{
  border-top:1px solid #404040;border-left:1px solid #404040;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
  box-shadow:inset 1px 1px 0 #808080;
}
.w98-menubar{
  height:20px;background:#c0c0c0;
  border-bottom:1px solid #808080;
  display:flex;align-items:center;padding:0 2px;gap:0;
  font-size:12px;font-family:"MS Sans Serif",Tahoma,sans-serif;flex-shrink:0;
}
.w98-menubar .wm-item{padding:2px 8px;cursor:pointer;color:#000}
.w98-menubar .wm-item:hover, .w98-menubar .wm-item.open{background:#000080;color:#fff}
.w98-window-body{flex:1;overflow:auto;background:#c0c0c0;padding:2px;display:flex;flex-direction:column}

/* Win98 Taskbar */
#w98-taskbar{
  position:absolute;bottom:0;left:0;right:0;height:32px;
  background:#c0c0c0;
  border-top:2px solid #fff;
  display:flex;align-items:center;padding:4px 4px 0;
  z-index:10000;
  font-family:"MS Sans Serif","Microsoft Sans Serif",Tahoma,sans-serif;
  font-size:12px;
}
#w98-start-btn{
  display:flex;align-items:center;gap:5px;padding:2px 6px;font-weight:700;font-size:13px;
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #404040;border-bottom:1px solid #404040;
  background:#c0c0c0;height:26px;min-width:64px;
  box-shadow:inset -1px -1px 0 #808080;
}
#w98-start-btn:active{
  border-top:1px solid #404040;border-left:1px solid #404040;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
}
#w98-start-btn .winlogo{width:16px;height:16px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px}
#w98-start-btn .winlogo div{background:#fff}
#w98-taskbar .w98-divider{width:1px;height:24px;background:#808080;border-right:1px solid #fff;margin:0 4px}
#w98-tray{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  border-top:1px solid #808080;border-left:1px solid #808080;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
  padding:2px 8px;height:24px;background:#c0c0c0;font-size:12px;
}
#w98-task-list{display:flex;flex:1;gap:3px;overflow-x:auto}
.w98-task-btn{
  display:flex;align-items:center;gap:4px;
  padding:2px 8px;height:26px;min-width:140px;max-width:200px;
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #404040;border-bottom:1px solid #404040;
  background:#c0c0c0;font-size:12px;
  box-shadow:inset -1px -1px 0 #808080;
  cursor:pointer;
  font-family:inherit;
}
.w98-task-btn.active{
  border-top:1px solid #404040;border-left:1px solid #404040;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
  box-shadow:inset 1px 1px 0 #808080;
  background:#a0a0a0;
}

/* Start Menu */
#start-menu{
  position:absolute;bottom:32px;left:4px;width:200px;
  background:#c0c0c0;
  border-top:2px solid #fff;border-left:2px solid #fff;
  border-right:2px solid #404040;border-bottom:2px solid #404040;
  display:none;z-index:10001;flex-direction:column;
  font-family:"MS Sans Serif",Tahoma,sans-serif;font-size:13px;
}
#start-menu.open{display:flex}
#start-menu .sm-sidebar{
  background:linear-gradient(90deg,#808080,#000080);
  color:#fff;font-weight:700;font-size:18px;
  padding:8px;width:24px;writing-mode:vertical-rl;
  display:flex;align-items:center;
}
#start-menu .sm-body{padding:2px 0;flex:1}
.sm-item{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 6px;cursor:pointer;color:#000}
.sm-item:hover{background:#000080;color:#fff}
.sm-item .sm-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sm-sep{height:1px;background:#808080;border-bottom:1px solid #fff;margin:2px 1px}
/* 开始菜单顶部：当前用户条（Win98 风格 chisel 内嵌） */
.sm-user{
  display:flex;align-items:center;gap:8px;padding:5px 6px;
  background:#c0c0c0;
  border-top:1px solid #808080;border-left:1px solid #808080;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
  margin:3px 4px;
}
.sm-user-av{
  width:28px;height:28px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:#000080;color:#fff;font-weight:700;font-size:15px;
  border-top:1px solid #404040;border-left:1px solid #404040;
  border-right:1px solid #a8a8a8;border-bottom:1px solid #a8a8a8;
}
.sm-user-txt{display:flex;flex-direction:column;line-height:1.25;overflow:hidden}
.sm-user-txt b{font-size:12px;color:#000;white-space:nowrap}
.sm-user-txt i{font-style:normal;font-size:11px;color:#404040;font-family:"Courier New",monospace;white-space:nowrap}

/* Finder / Explorer common */
.file-row{
  display:flex;align-items:center;padding:3px 8px;gap:6px;
  font-size:12px;cursor:pointer;border-bottom:.5px solid rgba(0,0,0,.05);
  color:var(--accent-color,#000);
}
.file-row:hover{background:#e8f0ff}
.file-row.selected{background:#0a84ff;color:#fff}
.file-row .file-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-row .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .file-size{color:#888;font-size:11px}
.file-row.selected .file-size{color:#fff}

/* macOS Finder specific */
.finder-mac{flex:1;display:flex;flex-direction:column;font-size:12px;background:#fff}
.finder-toolbar{
  height:38px;background:linear-gradient(180deg,#f8f8f8,#e2e2e2);
  border-bottom:.5px solid rgba(0,0,0,.15);
  display:flex;align-items:center;padding:0 10px;gap:8px;
}
.finder-toolbar .nav-btn{
  width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;
    color:#555;font-size:14px;
}
.finder-toolbar .nav-btn:hover{background:rgba(0,0,0,.08)}
.finder-toolbar .nav-btn.disabled{color:#ccc;pointer-events:none}
.finder-toolbar .finder-title{font-weight:600;font-size:13px;color:#333;margin-left:4px}
.finder-toolbar .search-box{
  margin-left:auto;background:#fff;border:1px solid rgba(0,0,0,.2);border-radius:5px;
  padding:3px 8px;font-size:12px;width:160px;
}
.finder-grid{
  flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:14px;padding:14px;overflow:auto;background:#fff;
}
.finder-grid-item{
  display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:6px;
  border-radius:6px;
}
.finder-grid-item:hover{background:#e8f0ff}
.finder-grid-item.selected{background:#0a84ff;color:#fff}
.finder-grid-item .file-thumb{width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:5px}
.finder-grid-item .file-name{font-size:12px;text-align:center;word-break:break-all;color:#333}
.finder-grid-item.selected .file-name{color:#fff}
.finder-statusbar{
  height:22px;background:linear-gradient(180deg,#f0f0f0,#d8d8d8);
  border-top:.5px solid rgba(0,0,0,.1);
  display:flex;align-items:center;padding:0 10px;
  font-size:11px;color:#666;
}

/* Win98 Explorer specific */
.w98-explorer{flex:1;display:flex;flex-direction:column;font-size:12px;background:#c0c0c0}
.w98-explorer-toolbar{
  height:28px;display:flex;align-items:center;gap:3px;padding:2px;border-bottom:1px solid #808080;
}
.w98-explorer-toolbar .w98-tbtn{
  height:22px;min-width:24px;padding:0 6px;
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #404040;border-bottom:1px solid #404040;
  background:#c0c0c0;display:flex;align-items:center;gap:3px;
  font-size:12px;font-family:inherit;cursor:pointer;
  box-shadow:inset -1px -1px 0 #808080;
}
.w98-explorer-toolbar .w98-tbtn:active{
  border-top:1px solid #404040;border-left:1px solid #404040;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
}
.w98-explorer-content{flex:1;display:flex;overflow:hidden}
.w98-explorer-tree{
  width:170px;background:#fff;border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #404040;border-bottom:1px solid #404040;
  padding:3px;overflow:auto;font-size:12px;
}
.w98-explorer-tree .tree-node{padding:2px 4px;cursor:pointer;display:flex;align-items:center;gap:4px}
.w98-explorer-tree .tree-node:hover{background:#e0e0e0}
.w98-explorer-tree .tree-node.selected{background:#000080;color:#fff}
.w98-explorer-files{
  flex:1;background:#fff;border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #404040;border-bottom:1px solid #404040;
  margin-left:3px;padding:6px;overflow:auto;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
  gap:8px;align-content:start;
}
.w98-explorer-file{
  display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:4px;
}

/* =====================================================================
   CALCULATOR
   ===================================================================== */
/* ★ 修复：原 padding:14 + display min-height:90 + grid min-height:380 + 状态栏 ≈ 539px，
   而 420 高的窗口去掉 38px 标题栏只剩 381px → 网格/按钮被裁。
   改为全自适应：显示区固定 84px，网格 flex:1 + minmax(0,1fr) 让行高随窗口自动分配。 */
.calc-mac{
  padding:12px;background:linear-gradient(180deg,#2c2c2e,#1c1c1e);
  height:100%;display:flex;flex-direction:column;color:#fff;
  box-sizing:border-box;overflow:hidden;
}
.calc-mac .display{
  background:#1c1c1e;color:#fff;font-size:44px;font-weight:300;text-align:right;
  padding:12px 14px;border-radius:8px;margin-bottom:12px;
  font-family:"SF Pro Display",-apple-system,sans-serif;
  overflow:hidden;flex:0 0 84px;
  display:flex;align-items:flex-end;justify-content:flex-end;word-break:break-all;
  box-sizing:border-box;
}
.calc-mac .grid{
  flex:1;min-height:0;
  display:grid;grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(5,minmax(0,1fr));gap:8px;
}
.calc-mac button{
  background:#3a3a3c;border-radius:50%;font-size:18px;font-weight:500;color:#fff;
  transition:all .1s;
  /* ★ 去掉固定 height:60px，改为撑满网格分配的单元格高度 */
  width:100%;height:100%;min-height:0;padding:0;margin:0;border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.calc-mac button:hover{filter:brightness(1.2)}
.calc-mac button:active{filter:brightness(0.85)}
.calc-mac button.fn{background:#a5a5a5;color:#000}
.calc-mac button.op{background:#ff9500;color:#fff}
.calc-mac button.op.active{background:#fff;color:#ff9500}
.calc-mac button.zero{grid-column:span 2;border-radius:999px;justify-content:flex-start;padding-left:24px;text-align:left}

.calc-w98{padding:6px;background:#c0c0c0;height:100%;display:flex;flex-direction:column;font-family:"MS Sans Serif",Tahoma,sans-serif}
.calc-w98 .display-w98{
  background:#fff;border-top:1px solid #404040;border-left:1px solid #404040;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
  text-align:right;padding:4px 6px;font-family:"Lucida Console",monospace;
  font-size:18px;margin-bottom:6px;min-height:28px;color:#000;
}
.calc-w98 .menu{font-size:12px;padding:2px 4px;border-bottom:1px solid #808080;margin-bottom:6px}
.calc-w98 .menu span{margin-right:12px;cursor:pointer}
.calc-w98 .menu span:hover{background:#000080;color:#fff}
.calc-w98 .grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:3px;min-height:280px}
.calc-w98 button.w-zero{grid-column:span 2}
.calc-w98 button.w-eq{grid-column:span 2}
.calc-w98 button{
  background:#c0c0c0;
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #404040;border-bottom:1px solid #404040;
  box-shadow:inset -1px -1px 0 #808080;
  font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;
  color:#000;min-height:24px;
}
.calc-w98 button:active{
  border-top:1px solid #404040;border-left:1px solid #404040;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
  box-shadow:inset 1px 1px 0 #808080;
}
.calc-w98 button.op{color:#a00}

/* =====================================================================
   MINESWEEPER
   ===================================================================== */
.mine-mac{
  padding:14px;background:linear-gradient(180deg,#f6f6f6,#e6e6e6);height:100%;
  display:flex;flex-direction:column;color:#333;
  box-sizing:border-box;overflow:hidden;
}
.mine-mac .toolbar{
  display:flex;justify-content:space-between;align-items:center;padding:6px 10px;
  background:linear-gradient(180deg,#fff,#d8d8d8);border-radius:6px;margin-bottom:10px;
  border:1px solid rgba(0,0,0,.1);
  flex:0 0 auto;   /* ★ 工具栏不被压缩 */
}
.mine-mac .stat{display:flex;align-items:center;gap:6px;background:#1c1c1e;color:#ff3b30;padding:4px 10px;border-radius:4px;font-family:"Courier New",monospace;font-weight:700;font-size:18px;min-width:60px;justify-content:center}
.mine-mac .face{font-size:24px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid rgba(0,0,0,.2);background:#fff}
.mine-mac .face:hover{background:#f0f0f0}
.mine-mac .face:active{transform:scale(0.95)}
/* ★ 修复：原 .grid 只被 render() 设了 gridTemplateColumns，没有行高；
   而 .cell 有 aspect-ratio:1 → 行高被撑成列宽(46px)，10 行需 492px，
   但 grid 实际只有 ~368px → 底部 3 行被裁。
   现在：棋盘整体锁正方形 + 行列都用 minmax(0,1fr)，格子随可用空间等比缩放。 */
.mine-mac .grid{
  flex:1 1 auto;min-height:0;
  aspect-ratio:1;max-width:100%;max-height:100%;
  align-self:center;                /* 水平居中 */
  display:grid;
  grid-template-columns:repeat(10,minmax(0,1fr));
  grid-template-rows:repeat(10,minmax(0,1fr));
  gap:2px;padding:6px;background:#999;border-radius:6px;
  box-sizing:border-box;
}
.mine-mac .cell{
  background:linear-gradient(180deg,#fff,#d0d0d0);border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;cursor:pointer;color:#000;
  border:1px solid rgba(0,0,0,.15);
  /* ★ 去掉 aspect-ratio:1（棋盘已是正方形，行列 1fr 自然让格子成正方） */
  width:100%;height:100%;min-width:0;min-height:0;padding:0;margin:0;
  transition:all .08s;
}
.mine-mac .cell:hover{filter:brightness(1.05)}
.mine-mac .cell.open{background:linear-gradient(180deg,#e8e8e8,#c8c8c8);border:1px solid rgba(0,0,0,.08)}
.mine-mac .cell.mine{background:#ff3b30;color:#fff}
.mine-mac .cell.n1{color:#1976d2}
.mine-mac .cell.n2{color:#388e3c}
.mine-mac .cell.n3{color:#d32f2f}
.mine-mac .cell.n4{color:#7b1fa2}
.mine-mac .cell.n5{color:#ff8f00}
.mine-mac .cell.n6{color:#00838f}
.mine-mac .cell.n7{color:#000}
.mine-mac .cell.n8{color:#616161}
.mine-mac .cell.flag::after{content:"🚩"}
.mine-mac .cell.mine::after{content:"💣"}
.mine-mac .cell.mine.win::after{content:"✅"}

.mine-w98{
  padding:6px;background:#c0c0c0;height:100%;display:flex;flex-direction:column;
  font-family:"MS Sans Serif",Tahoma,sans-serif;
}
.mine-w98 .toolbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px;border-top:2px solid #808080;border-left:2px solid #808080;
  border-right:2px solid #fff;border-bottom:2px solid #fff;margin-bottom:6px;
  flex:0 0 auto;   /* ★ 工具栏不被压缩 */
}
.mine-w98 .display-led{
  background:#000;color:#f00;font-family:"DSEG7","Courier New",monospace;
  font-size:18px;font-weight:700;padding:2px 6px;border:1px solid #444;
  text-shadow:0 0 4px #f00;letter-spacing:1px;
}
.mine-w98 .face-w{
  width:28px;height:28px;font-size:18px;
  border-top:2px solid #fff;border-left:2px solid #fff;
  border-right:2px solid #404040;border-bottom:2px solid #404040;
  background:#c0c0c0;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.mine-w98 .face-w:active{
  border-top:2px solid #404040;border-left:2px solid #404040;
  border-right:2px solid #fff;border-bottom:2px solid #fff;
}
.mine-w98 .grid-w{
  flex:1;min-height:0;display:grid;gap:0;background:#808080;padding:2px;
  grid-template-columns:repeat(10,minmax(0,1fr));
  grid-template-rows:repeat(10,minmax(0,1fr));
  box-sizing:border-box;
}
.mine-w98 .cell-w{
  background:#c0c0c0;border-top:2px solid #fff;border-left:2px solid #fff;
  border-right:2px solid #404040;border-bottom:2px solid #404040;
  display:flex;align-items:center;justify-content:center;
  font-family:"MS Sans Serif",Tahoma,sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;color:#000;min-width:18px;min-height:18px;
}
.mine-w98 .cell-w.open{
  border:1px solid #808080;background:#c0c0c0;
}
.mine-w98 .cell-w.mine-w{background:#f00;color:#000}
.mine-w98 .cell-w.n1{color:#0000ff}
.mine-w98 .cell-w.n2{color:#008000}
.mine-w98 .cell-w.n3{color:#ff0000}
.mine-w98 .cell-w.n4{color:#000080}
.mine-w98 .cell-w.n5{color:#800000}
.mine-w98 .cell-w.n6{color:#008080}
.mine-w98 .cell-w.n7{color:#000}
.mine-w98 .cell-w.n8{color:#808080}

/* =====================================================================
   TERMINAL
   ===================================================================== */
.term-mac{display:flex;flex-direction:column;height:100%;background:rgba(20,20,22,.96);color:#fff;font-family:"SF Mono","Monaco","Menlo",monospace;font-size:12px;overflow:hidden}
.term-mac .term-title{padding:6px 12px;background:rgba(0,0,0,.4);border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px;font-size:11px;color:#aaa}
.term-mac .term-title .dot{width:10px;height:10px;border-radius:50%}
.term-mac .term-title .dot.r{background:#ff5f57}
.term-mac .term-title .dot.y{background:#febc2e}
.term-mac .term-title .dot.g{background:#28c840}
.term-mac .term-body{flex:1;padding:12px;overflow-y:auto;line-height:1.6}
.term-mac .term-body .ln{white-space:pre-wrap;word-break:break-all}
.term-mac .term-body .ln.cmd{color:#7df9ff}
.term-mac .term-body .ln.err{color:#ff7b72}
.term-mac .term-body .ln.ok{color:#7ee787}
.term-mac .term-body .ln.warn{color:#ffa657}
.term-mac .term-input{padding:6px 12px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border-top:1px solid rgba(255,255,255,.1)}
.term-mac .term-input .prompt{color:#7df9ff}
.term-mac .term-input input{flex:1;color:#fff;font-family:inherit;font-size:12px;background:transparent;outline:none;caret-color:#7df9ff}

.term-w98{display:flex;flex-direction:column;height:100%;background:#000;color:#c0c0c0;font-family:"Lucida Console","Courier New",monospace;font-size:13px;overflow:hidden;padding:2px}
.term-w98 .menu-w{background:#c0c0c0;color:#000;padding:1px 2px;border-bottom:1px solid #808080;font-size:12px;font-family:"MS Sans Serif",Tahoma,sans-serif;display:flex;gap:10px;margin:-2px -2px 2px -2px}
.term-w98 .menu-w span{cursor:pointer}
.term-w98 .menu-w span:hover{background:#000080;color:#fff}
.term-w98 .term-body-w{flex:1;overflow-y:auto;padding:4px;line-height:1.4;background:#000}
.term-w98 .term-body-w .ln{white-space:pre-wrap;word-break:break-all}
.term-w98 .term-body-w .ln.cmd{color:#fff;font-weight:700}
.term-w98 .term-body-w .ln.err{color:#f55}
.term-w98 .term-body-w .ln.ok{color:#5f5}
.term-w98 .term-input-w{padding:2px;display:flex;align-items:center;gap:0;background:#000}
.term-w98 .term-input-w .prompt{color:#c0c0c0}
.term-w98 .term-input-w input{flex:1;color:#c0c0c0;font-family:inherit;font-size:13px;background:transparent;outline:none;caret-color:#fff;padding-left:4px}

/* =====================================================================
   DIALOG
   ===================================================================== */
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:99999;display:none;align-items:center;justify-content:center}
.dialog-overlay.open{display:flex}
.mac-dialog{background:#ececec;border-radius:10px;padding:18px;min-width:280px;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.5);border:1px solid rgba(0,0,0,.15)}
.mac-dialog h3{font-size:15px;margin-bottom:8px;color:#333}
.mac-dialog p{font-size:13px;color:#666;margin-bottom:14px;line-height:1.5}
.mac-dialog .actions{display:flex;gap:8px;justify-content:flex-end}
.mac-dialog button{padding:5px 18px;background:#0a84ff;color:#fff;border-radius:6px;font-size:13px;font-weight:500}
.mac-dialog button:hover{background:#0070e0}
.mac-dialog button.secondary{background:#e5e5ea;color:#000}
.mac-dialog button.secondary:hover{background:#d0d0d5}

.w98-dialog{background:#c0c0c0;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #404040;border-bottom:2px solid #404040;min-width:320px;max-width:460px;display:flex;flex-direction:column;font-family:"MS Sans Serif",Tahoma,sans-serif}
.w98-dialog .title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;font-size:12px;padding:2px 4px;display:flex;justify-content:space-between;align-items:center}
.w98-dialog .title .x{width:16px;height:14px;background:#c0c0c0;color:#000;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #404040;border-bottom:1px solid #404040;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:"Marlett"}
.w98-dialog .body{padding:14px;font-size:13px;line-height:1.5;color:#000}
.w98-dialog .actions{padding:6px;display:flex;justify-content:center;gap:6px}
.w98-dialog button{padding:4px 14px;background:#c0c0c0;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #404040;border-bottom:1px solid #404040;box-shadow:inset -1px -1px 0 #808080;font-family:inherit;font-size:12px;cursor:pointer;min-width:70px}
.w98-dialog button:active{border-top:1px solid #404040;border-left:1px solid #404040;border-right:1px solid #fff;border-bottom:1px solid #fff;box-shadow:inset 1px 1px 0 #808080}

/* "功能开发中" 提示 */
.tip-toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:8px;
  font-size:13px;z-index:999999;opacity:0;transition:opacity .25s;pointer-events:none;
}
.tip-toast.show{opacity:1}

/* Scrollbar style */
.mac-window-body::-webkit-scrollbar{width:10px;height:10px}
.mac-window-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.3);border-radius:5px}
.mac-window-body::-webkit-scrollbar-track{background:transparent}
</style>

const el = (tag, attrs={}, ...kids)=>{
  // ★ 关键修复：svg 必须用 createElementNS 创建，否则得到 HTMLUnknownElement，
  //   内部的 <use>/<rect>/<path> 全部落在 HTML 命名空间，浏览器不渲染 → Dock 图标全透明
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const e = (tag==='svg') ? document.createElementNS(SVG_NS, 'svg') : document.createElement(tag);
  // 事件名白名单：兼容 dblclick / click / mouse* / key* / input / change / focus / blur 等
  const EVENT_NAMES = new Set(['click','dblclick','mousedown','mouseup','mousemove','mouseover','mouseout','mouseenter','mouseleave',
    'keydown','keyup','keypress','input','change','focus','blur','submit','reset','load','error','select','resize','scroll','contextmenu','wheel','touchstart','touchend','touchmove']);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='style') e.style.cssText=v;
    // ★ 关键修复：innerHTML/textContent/innerText 必须走 IDL 赋值，setAttribute 对 SVG 无效
    else if(k==='innerHTML' || k==='innerText' || k==='textContent') e[k] = v;
    else if(k.startsWith('on')) e[k.toLowerCase()] = v;  // onclick / ondblclick
    else if(EVENT_NAMES.has(k.toLowerCase())) e['on'+k.toLowerCase()] = v;  // dblclick / click → ondblclick / onclick
    else if(v===true) e.setAttribute(k,'');
    else if(v===false||v==null) {} // 跳过
    else e.setAttribute(k,v);
  });
  kids.flat().forEach(k=>{
    if(k==null) return;
    e.append(k.nodeType?k:document.createTextNode(k));
  });
  return e;

/* ===================================================================
   PROCESS MANAGER + RESOURCE METER (deterministic, no Math.random)
   Each open window owns one process. Process exposes:
     pid, type, title, status (Running|Ready|Blocked|Zombie),
     memKB, cpuMs, cpuHistory[] (rolling 1s bucket), pending (ms).
   The Scheduler grants at most 100ms of "model CPU work" per 100ms tick
   on the single-core, mode='live'. mode='manual' freezes auto dispatch
   but preserves already-accrued cpuMs / memKB.
   =================================================================== */
class ProcessManager {
  constructor(){
    this.processes = new Map();   // pid -> process
    this.byType = new Map();     // appType -> pid (latest instance)
    this.nextPid = 101;
    this.mode = 'live';          // 'live' | 'manual'
    this.tickMs = 100;
    this.cpuPct = 0;             // 0..100 (single core)
    this.cpuHistory = [];         // [{ts, ms}]
    this.tickHandle = null;
    this.onTick = null;          // callback fired every tick (for terminal UI refresh)
    this._lastTickTs = Date.now();
    this._tick();
    this.tickHandle = setInterval(()=>this._tick(), this.tickMs);
  }
  // Public API ---------------------------------------------------------
  spawn(type, title, ctx={}){
    const pid = this.nextPid++;
    const p = {
      pid, title, ctx,
      type,
      status: 'Ready',
      memKB: ctx.memKB || 1024,         // base 1MiB
      cpuMs: 0,                          // total accumulated model CPU ms
      cpuHistory: [],                    // [{ts, ms}]
      pending: 0,                        // pending work awaiting schedule
      work: ctx.work || null,            // function returning ms-cost this tick
      onBlock: ctx.onBlock || null,
      onWake: ctx.onWake || null,
      createdAt: Date.now(),
    };
    this.processes.set(pid, p);
    this.byType.set(type, pid);
    // First tick turns Ready -> Running (live mode only)
    if(this.mode==='live') p.status = 'Running';
    return p;
  }
  terminate(pid){
    const p = this.processes.get(pid); if(!p) return;
    // ★ 清理该进程注册的所有内部定时器（appInterval 注册），防止僵尸计时器
    if(p._timers && p._timers.length){ p._timers.forEach(t=>clearInterval(t)); p._timers.length=0; }
    if(this.byType.get(p.type)===pid) this.byType.delete(p.type);
    this.processes.delete(pid);
  }
  block(pid){
    const p = this.processes.get(pid); if(!p) return '未找到该 PID';
    if(p.status!=='Running') return `无法阻塞，进程当前为 ${p.status}`;
    p.status='Blocked';
    return `PID ${pid} -> Blocked`;
  }
  wake(pid){
    const p = this.processes.get(pid); if(!p) return '未找到该 PID';
    if(p.status!=='Blocked') return `无法唤醒，进程当前为 ${p.status}`;
    p.status='Ready';
    // scheduler will pick it up next tick (live mode only)
    return `PID ${pid} -> Ready`;
  }
  step(){
    // single 100ms time-slice
    if(this.mode!=='manual') return '当前不是手动模式，step 无效';
    this._tick(true);
    return `单步 100ms 已执行`;
  }
  setMode(m){
    this.mode = m;
    if(m==='live'){
      // resume: clear pending frozen work but keep accumulators
      this.processes.forEach(p=>{ if(p.status==='Ready') p.status='Running'; });
      return '已切到 live，自动调度恢复';
    } else {
      return '已切到 manual，自动调度冻结';
    }
  }
  // PCB block (process control block) --------------------------------
  pcb(pid){
    const p = this.processes.get(pid); if(!p) return null;
    return {
      PID: p.pid, NAME: p.title, TYPE: p.type, STATE: p.status,
      MEM_KB: p.memKB, CPU_MS: p.cpuMs, CPU_PCT: this.cpuPct.toFixed(1),
      PENDING_MS: p.pending, UPTIME_MS: Date.now()-p.createdAt,
    };
  }
  psList(){
    return [...this.processes.values()].sort((a,b)=>a.pid-b.pid);
  }
  // Scheduler --------------------------------------------------------
  _tick(force=false){
    if(!force && this.mode!=='live') {
      // freeze: don't change any state, but still tick the clock
      this._lastTickTs = Date.now();
      return;
    }
    const now = Date.now();
    const delta = now - this._lastTickTs;
    this._lastTickTs = now;
    // Clean old CPU history (keep last 1000ms)
    const cutoff = now - 1000;
    while(this.cpuHistory.length && this.cpuHistory[0].ts < cutoff) this.cpuHistory.shift();
    // Single-core, this tick we grant at most deltaMs (typically 100ms) total work
    let budget = Math.min(delta, this.tickMs);
    // Dispatch policy: round-robin on Running processes
    const running = [];
    this.processes.forEach(p=>{
      if(p.status==='Running') running.push(p);
    });
    let totalUsed = 0;
    running.forEach(p=>{
      if(budget<=0) return;
      let cost = 0;
      if(typeof p.work==='function') cost = Math.max(0, p.work(delta) | 0);
      else cost = delta; // default idle cost: full tick
      const grant = Math.min(cost, budget);
      p.cpuMs += grant;
      p.cpuHistory.push({ts: now, ms: grant});
      // bound inner history to last 1s
      while(p.cpuHistory.length && p.cpuHistory[0].ts < cutoff) p.cpuHistory.shift();
      budget -= grant;
      totalUsed += grant;
    });
    this.cpuHistory.push({ts: now, ms: totalUsed});
    // CPU% = sum ms of last 1s / 10
    const sumMs = this.cpuHistory.reduce((a,b)=>a+b.ms, 0);
    this.cpuPct = Math.min(100, sumMs/10);
    if(this.onTick) this.onTick();
  }
  // For terminal to format table
  totalMem(){
    let sum = 0; this.processes.forEach(p=>sum+=p.memKB); return sum;
  }
}
const PM = new ProcessManager();
window.PM = PM;
// Notify terminal refresh whenever processes change (cheap)
const _origSpawn = PM.spawn.bind(PM);
PM.spawn = function(...a){ const p=_origSpawn(...a); return p; };
const _origTerm = PM.terminate.bind(PM);
PM.terminate = function(pid){ _origTerm(pid); return true; };

/* ===================================================================
   WINDOW MANAGER (single class handling both OS chrome styles)
   =================================================================== */
class WindowManager {
  constructor() {
    this.zCounter = 1000;
    this.windows = new Map(); // id -> {el, app, winState}
    this.dockItems = {};      // appId -> dock DOM element (macOS: 用于"最小化窗口指示"与点击恢复)
  }
  open(app, opts={}){
    if(app==='finder') return this.openFinder(opts);
    const id = app + '_' + uid();
    const a = APPS[app];
    if(!a){ showTip('未找到应用：'+app); return; }
    const isMac = currentOS === 'macos';
    let w = (isMac && a.macWidth)  ? a.macWidth  : a.width;
    let h = (isMac && a.macHeight) ? a.macHeight : a.height;
    const desktop = $('#'+currentOS+'-desktop');
    const rect = desktop.getBoundingClientRect();
    // ★ 小屏适配：窗口不得超过桌面可用区，否则底部/右侧被裁到屏幕外。
    //   macOS 额外预留 Dock 高度(~96)，Win98 预留任务栏(~44)。
    const reserveH = isMac ? 96 : 44;
    const availW = Math.max(300, rect.width - 40);
    const availH = Math.max(220, rect.height - reserveH);
    if(w > availW) w = availW;
    if(h > availH) h = availH;
    // deterministic cascade placement (no Math.random)
    const openCount = (window._openCount = (window._openCount||0) + 1);
    const x = Math.max(20, Math.min(rect.width - w - 20, 80 + ((openCount*37)%120)));
    const y = Math.max(20, Math.min(rect.height - h - reserveH, 50 + ((openCount*53)%80)));
    const win = el('div', {
      class: isMac ? 'mac-window' : 'w98-window',
      style:`left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++this.zCounter}`,
      'data-id': id, 'data-app': app
    });
    if(isMac){
      const tb = el('div', { class:'mac-titlebar' },
        el('div', { class:'traffic-lights' },
          el('button', { class:'tl close', title:'关闭（结束进程）', onclick:(e)=>{e.stopPropagation();this.close(id);} }, el('span',{},'×')),
          el('button', { class:'tl min', title:'最小化（PID保留）', onclick:(e)=>{e.stopPropagation();this.minimize(id);} }, el('span',{},'−')),
          el('button', { class:'tl max', title:'放大还原', onclick:(e)=>{e.stopPropagation();this.toggleMax(id);} }, el('span',{},'+')),
        ),
        el('div', { class:'title' }, a.title + (opts.suffix||''))
      );
      win.appendChild(tb);
      this._dragHandler(win, tb);
    } else {
      const tb = el('div', { class:'w98-titlebar' },
        el('span', { class:'w98-title-text' }, a.title),
        el('div', { class:'w98-ctrls' },
          el('button', { class:'w98-btn', title:'最小化', onclick:(e)=>{e.stopPropagation();this.minimize(id);} }, '_'),
          el('button', { class:'w98-btn', title:'最大化', onclick:(e)=>{e.stopPropagation();this.toggleMax(id);} }, '□'),
          el('button', { class:'w98-btn', title:'关闭', onclick:(e)=>{e.stopPropagation();this.close(id);} }, '×'),
        )
      );
      win.appendChild(tb);
      // Win98 menu bar
      const mb = el('div', { class:'w98-menubar' },
        el('span', { class:'wm-item', onclick:()=>showTip('文件菜单') }, '文件(F)'),
        el('span', { class:'wm-item', onclick:()=>showTip('编辑菜单') }, '编辑(E)'),
        el('span', { class:'wm-item', onclick:()=>showTip('视图菜单') }, '视图(V)'),
        el('span', { class:'wm-item', onclick:()=>showTip('帮助菜单') }, '帮助(H)'),
      );
      win.appendChild(mb);
      this._dragHandler(win, tb);
    }
    const body = el('div', { class: isMac ? 'mac-window-body' : 'w98-window-body', style:'flex:1;overflow:hidden' });
    win.appendChild(body);
    desktop.appendChild(win);
    win.addEventListener('mousedown', ()=>this.focus(id));
    this._makeResizable(win);   // ★ 挂载自由缩放手柄
    // Spawn a process for this window. Builder returns the per-tick work fn & memKB hooks.
    const proc = PM.spawn(app, a.title, { memKB: APPS_PROC_DEFAULTS[app]?.memKB || 1024, work: ()=>APPS_PROC_DEFAULTS[app]?.work?.() ?? 5 });
    const meta = { el: win, app, appType:app, isMac, minimized:false, maximized:false, pid: proc.pid, proc };
    this.windows.set(id, meta);
    // ★ 修复：原先 builder 抛错时 (例如 buildMineWin 漏掉 proc 参数)，后面的 focus() + refreshTaskbar() 都不会执行，
    //        导致 WM.windows 里有 zombie meta、任务栏出现"打不开也关不掉"的残影按钮。
    try {
      APP_BUILDERS[app](body, isMac, this, id, proc);
    } catch(err){
      console.error('[WM.open] builder "'+app+'" threw:', err);
      showTip('应用启动失败：'+app+'（'+err.message+'）');
      // 立即回收，避免僵尸窗口/僵尸进程
      this.windows.delete(id);
      win.remove();
      if(proc?.pid) PM.terminate(proc.pid);
      this.refreshTaskbar();
      return null;
    }
    this.focus(id);
    this.refreshTaskbar();
    this.syncDock();
    return meta;
  }
  focus(id){
    const w = this.windows.get(id); if(!w||w.minimized) return;
    w.el.style.zIndex = ++this.zCounter;
    this.refreshTaskbar();
  }
  close(id){
    const w = this.windows.get(id); if(!w) return;
    // ★ 关键修复：同步删除！原实现把 windows.delete + refreshTaskbar 放进 150ms 的 setTimeout，
    //   这段窗口期内任务栏按钮仍然存在（且后台标签页 setTimeout 会被节流到 ≥1s），
    //   造成"窗口已关、任务栏残影关不掉"的僵尸按钮。
    //   现在：先同步从 map 移除并刷新任务栏（按钮瞬间消失），动画只负责移除 DOM 元素。
    if(w.pid) PM.terminate(w.pid);
    this.windows.delete(id);
    this.refreshTaskbar();
    this.syncDock();
    const winEl = w.el;
    winEl.style.transition='all .15s';
    winEl.style.opacity='0'; winEl.style.transform='scale(0.9)';
    setTimeout(()=>{ winEl.remove(); }, 150);
  }
  minimize(id){
    const w = this.windows.get(id); if(!w) return;
    w.minimized = true; w.el.style.display='none';
    this.syncDock();
    this.refreshTaskbar();
  }
  toggleMax(id){
    const w = this.windows.get(id); if(!w) return;
    w.maximized = !w.maximized;
    w.el.classList.toggle('maximized', w.maximized);
    this.refreshTaskbar();
  }
  restore(id){
    const w = this.windows.get(id); if(!w) return;
    w.minimized = false;
    w.el.style.display='';
    this.focus(id);
    this.syncDock();
  }
  // ★ macOS Dock 智能点击：优先恢复最小化的窗口，其次聚焦现有窗口，最后开新窗口
  dockClick(appId){
    const wins = [...this.windows.entries()].filter(([k,v])=>v.app===appId);
    const min = wins.find(([k,v])=>v.minimized);
    if(min) return this.restore(min[0]);
    const open = wins.find(([k,v])=>!v.minimized);
    if(open) return this.focus(open[0]);
    return this.open(appId);
  }
  // ★ 同步 Dock 状态：当某 app 存在最小化窗口时，给对应 dock 图标加 .has-minimized 类（下方出现小圆点）
  syncDock(){
    if(currentOS!=='macos' || !this.dockItems) return;
    for(const [appId, el] of Object.entries(this.dockItems)){
      if(!el || !el.isConnected) continue;
      const hasMin = [...this.windows.values()].some(w=>w.app===appId && w.minimized);
      el.classList.toggle('has-minimized', hasMin);
    }
  }
  refreshTaskbar(){
    if(currentOS!=='win98') return;
    // ★ 防御性清理：如果某个 meta 的 el 已经脱离 DOM（理论不应发生，但作为兜底），从 map 中删除并 PM.terminate
    this.windows.forEach((w,id)=>{
      if(!w.el || !w.el.isConnected){
        if(w.pid) PM.terminate(w.pid);
        this.windows.delete(id);
      }
    });
    const list = $('#w98-task-list'); list.innerHTML='';
    this.windows.forEach((w,id)=>{
      const a = APPS[w.appType];
      const btn = el('button', {
        class:'w98-task-btn' + (w.minimized?'':' active'),
        title: a.title,
        onclick:()=>{
          if(w.minimized) this.restore(id);
          else if(parseInt(w.el.style.zIndex) === this.zCounter) this.minimize(id);
          else this.focus(id);
        }
      },
        el('span', {}, a.title),
      );
      list.appendChild(btn);
    });
  }
  /* ★ 窗口自由缩放：右边缘 / 底边缘 / 右下角 三个拖拽手柄
     - 手柄本身透明，只提供 hover 光标（ew-resize / ns-resize / nwse-resize）
     - 下限 MIN_W×MIN_H = 300×200，上限为桌面可视区，防止缩到不可见或拖出屏幕 */
  _makeResizable(win){
    if(win.dataset.resizable === '1') return;   // 幂等，避免重复挂载
    win.dataset.resizable = '1';
    const MIN_W = 300, MIN_H = 200;
    // 顺序很重要：se 必须最后插入，才能盖在 e / s 之上（同为 z-index:9 时后者在上）
    [['e'],['s'],['se']].forEach(([dir])=>{
      const h = el('div',{ class:'win-rsz '+dir, 'data-dir':dir, title:'拖拽调整窗口大小' });
      win.appendChild(h);
      h.addEventListener('mousedown',(e)=>{
        if(e.button !== 0) return;                       // 只响应左键
        if(win.classList.contains('maximized')) return;  // 最大化状态不缩放
        e.stopPropagation();            // 不要触发窗口 mousedown（避免抢焦点/误判）
        e.preventDefault();             // 阻止原生拖拽选区
        const startX = e.clientX, startY = e.clientY;
        const sw = win.offsetWidth, sh = win.offsetHeight;
        const desktop = win.parentElement;
        const dr = desktop ? desktop.getBoundingClientRect() : {width:9999, height:9999};
        const maxW = Math.max(MIN_W, dr.width  - 8);
        const maxH = Math.max(MIN_H, dr.height - 8);
        const move = (ev)=>{
          let nw = sw, nh = sh;
          if(dir === 'e'  || dir === 'se') nw = sw + (ev.clientX - startX);
          if(dir === 's'  || dir === 'se') nh = sh + (ev.clientY - startY);
          nw = Math.max(MIN_W, Math.min(maxW, nw));
          nh = Math.max(MIN_H, Math.min(maxH, nh));
          win.style.width  = nw + 'px';
          win.style.height = nh + 'px';
        };
        const up = ()=>{
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          document.body.classList.remove('wm-resizing');
        };
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
        document.body.classList.add('wm-resizing');
      });
    });
  }
  _dragHandler(win, tb){
    let dx=0,dy=0,drag=false;
    tb.addEventListener('mousedown',(e)=>{
      if(e.target.tagName==='BUTTON' || e.target.closest('button')) return;
      if(win.classList.contains('maximized')) return;
      drag=true; dx=e.clientX-win.offsetLeft; dy=e.clientY-win.offsetTop;
      e.preventDefault();
    });
    document.addEventListener('mousemove',(e)=>{
      if(!drag) return;
      const desktop = win.parentElement;
      const r = desktop.getBoundingClientRect();
      let nx=e.clientX-dx, ny=e.clientY-dy;
      nx=Math.max(-win.offsetWidth+100, Math.min(r.width-50, nx));
      ny=Math.max(0, Math.min(r.height-40, ny));
      win.style.left=nx+'px'; win.style.top=ny+'px';
    });
    document.addEventListener('mouseup',()=>drag=false);
  }
}

/* ===================================================================
   FINDER (macOS)
   =================================================================== */
function buildMacFinder(body, root, wm, yip, proc, initPath){
  let current = root, pathStack=[root], pathIdx=0;
  // 找到指定 path 的目录
  if(initPath){
    const parts = initPath.split('/').filter(Boolean);
    let node = root;
    let ok = true;
    for(const p of parts){
      if(!node.children){ ok=false; break; }
      const next = node.children.find(c=>c.name===p);
      if(!next){ ok=false; break; }
      pathStack.push(next);
      node = next;
    }
    if(ok){
      pathIdx = pathStack.length-1;
      current = pathStack[pathIdx];
    }
  }
  const grid = el('div',{class:'finder-grid'});
  const tb = el('div',{class:'finder-toolbar'});
  const back = el('button',{class:'nav-btn',onclick:()=>goBack()},'◀');
  const fwd = el('button',{class:'nav-btn',onclick:()=>goFwd()},'▶');
  const title = el('span',{class:'finder-title'},root.name);
  const search = el('input',{class:'search-box',type:'text',placeholder:'搜索', oninput:(e)=>renderGrid(e.target.value)});
  tb.append(back,fwd,title,search);
  const sb = el('div',{class:'finder-statusbar'},'');
  body.append(tb, grid, sb);
  function setNav(){
    back.classList.toggle('disabled', pathIdx<=0);
    fwd.classList.toggle('disabled', pathIdx>=pathStack.length-1);
    title.textContent = pathStack.slice(1).map(p=>p.name).join('/') || current.name;
  }
  function goBack(){ if(pathIdx>0){pathIdx--; current=pathStack[pathIdx]; setNav(); renderGrid();} }
  function goFwd(){ if(pathIdx<pathStack.length-1){pathIdx++; current=pathStack[pathIdx]; setNav(); renderGrid();} }
  function openNode(node){
    if(node.type==='folder'){
      node.children = node.children||[];
      pathStack=pathStack.slice(0,pathIdx+1);
      pathStack.push(node);
      pathIdx=pathStack.length-1;
      current=node;
      setNav(); renderGrid();
    } else if(node.type==='app'){
      wm.close(yip);
      wm.open(node.app);
    } else {
      showTip('正在打开：'+node.name+'（双击文件）');
    }
  }
  function renderGrid(filter=''){
    grid.innerHTML='';
    const list = (current.children||[]).filter(n=>!filter || n.name.toLowerCase().includes(filter.toLowerCase()));
    list.forEach(n=>{
      const item = document.createElement('div');
      item.className = 'finder-grid-item';
      item.dataset.name = n.name;
      item.dataset.type = n.type;
      item.dataset.app = n.app || '';
      // ★ 用 addEventListener 绑定 click + dblclick（单击选中、双击打开）
      let lastClickAt = 0;
      item.addEventListener('click', (e)=>{
        e.stopPropagation();
        const now = Date.now();
        if(now - lastClickAt < 350){
          lastClickAt = 0;
          openNode(n);
        } else {
          lastClickAt = now;
          grid.querySelectorAll('.finder-grid-item').forEach(x=>x.classList.remove('selected'));
          item.classList.add('selected');
        }
      });
      // 双击文件 .doc/.txt → 弹"打开"提示（教学模型：模拟文件查看）
      if(n.type === 'file'){
        item.addEventListener('dblclick', ()=>{
          showDialog('mac', '打开文件：'+n.name, '文件内容（教学模型预览）：\n\n这是一个 '+(n.size||'?')+' 的 '+n.name+' 文件。\n\n真实系统会用对应应用打开，\n本仿真展示系统调用路径。');
        });
      }
      const thumb = document.createElement('div');
      thumb.className = 'file-thumb';
      if(n.icon){
        thumb.innerHTML = `<svg width="52" height="52"><use href="#${n.icon}"/></svg>`;
      } else {
        thumb.textContent = '📄';
      }
      const nm = document.createElement('div');
      nm.className = 'file-name';
      nm.textContent = n.name;
      item.appendChild(thumb);
      item.appendChild(nm);
      grid.appendChild(item);
    });
    sb.textContent = list.length+' 个项目' + (filter?(' · 搜索 "'+filter+'"'):'');
  }
  setNav(); renderGrid();
}

/* ===================================================================
   EXPLORER (Win98)
   =================================================================== */
function buildWin98Explorer(body, root, wm, yip){
  const tb = el('div',{class:'w98-explorer-toolbar'},
    el('button',{class:'w98-tbtn',onclick:()=>showTip('上一级')},'←'),
    el('button',{class:'w98-tbtn',onclick:()=>showTip('下一级')},'→'),
    el('button',{class:'w98-tbtn',onclick:()=>showTip('向上')},'↑'),
    el('div',{style:'width:8px'}),
    el('button',{class:'w98-tbtn',onclick:()=>showTip('剪切')},'剪切'),
    el('button',{class:'w98-tbtn',onclick:()=>showTip('复制')},'复制'),
    el('button',{class:'w98-tbtn',onclick:()=>showTip('粘贴')},'粘贴'),
  );
  const tree = el('div',{class:'w98-explorer-tree'});
  const files = el('div',{class:'w98-explorer-files'});
  const content = el('div',{class:'w98-explorer-content'},tree,files);
  const sb = el('div',{class:'w98-statusbar'},
    el('span',{class:'stsb-fld',id:'w98-cur-path'},root.name),
    el('span',{class:'stsb-fld',style:'flex:0 0 100px'},'0 个对象'),
  );
  body.append(tb, content, sb);
  let cur = root, curNode = null;
  function renderTree(){
    tree.innerHTML='';
    const rootNode = el('div',{class:'tree-node', onclick:()=>selectNode(root)},
      el('span',{},'📁 '), el('span',{},root.name));
    tree.appendChild(rootNode);
    (root.children||[]).forEach(c=>{
      if(c.type==='folder'){
        const tn = el('div',{class:'tree-node', onclick:()=>selectNode(c)},
          el('span',{},'📁 '), el('span',{},c.name));
        tree.appendChild(tn);
      }
    });
  }
  function selectNode(node){
    cur = node; curNode = node;
    $('#w98-cur-path', sb).textContent = node.name;
    tree.querySelectorAll('.tree-node').forEach(n=>n.classList.remove('selected'));
    event && event.currentTarget && event.currentTarget.classList.add('selected');
    renderFiles();
  }
  function renderFiles(){
    files.innerHTML='';
    (cur.children||[]).forEach(n=>{
      const f = el('div',{class:'w98-explorer-file',
        dblclick:()=>openItem(n)},
        el('div',{class:'file-thumb'},
          n.icon?el('svg',{width:'32',height:'32',innerHTML:'<use href="#'+n.icon+'"/>'}):''),
        el('div',{class:'file-name'},n.name));
      files.appendChild(f);
    });
    sb.lastChild.textContent = (cur.children||[]).length+' 个对象';
  }
  function openItem(node){
    if(node.type==='folder'){ selectNode(node); }
    else if(node.app){ wm.close(yip); wm.open(node.app); }
    else { showTip('打开文件：'+node.name+'（'+node.size+'）'); }
  }
  renderTree();
  renderFiles();
  // Initial select C:
  cur = root; curNode = root;
}

   =================================================================== */
// 报告要求：PCB 必须体现「进程所属用户」与「处理机现场（程序计数器）」两个字段。
// 本演示为单用户教学模型，两列取固定示例值；若要与全局登录用户保持一致，
// 把 PCB_USER 换成 USER.name 即可。
const PCB_USER = 'zhangsan';    // 进程所属用户 (UID owner)
const PCB_PC   = '0x0000';      // 程序计数器 PC（下一条待执行指令地址）

function buildPcbMac(body, wm, yip, proc){
  // PCB = Process Control Block. 进程控制面板 / Process Monitor.
  // 数据源：与终端 `ps` / `pcb <pid>` 命令共享 ProcessManager (PM)。
  const root = el('div',{class:'pcb-mon'});

  // ========== Header ==========
  const badge = el('span',{class:'badge live'},'● LIVE');
  const header = el('div',{class:'pcb-mon-hd'},
    el('div',{class:'pcb-mon-title'},
      el('span',{class:'dot'}),
      '进程控制面板',
      el('small',{},'Process Monitor · '+proc.title)
    ),
    el('div',{class:'pcb-mon-badges'}, badge)
  );

  // ========== Top dashboard (4 metric cards) ==========
  const cardProc = el('div',{class:'card'},
    el('div',{class:'label'},'Processes'),
    el('div',{class:'val',id:'pm-cnt'},'0'),
    el('div',{class:'sub'},'进程总数'));
  const cardCpu = el('div',{class:'card cpu'},
    el('div',{class:'label'},'CPU'),
    el('div',{class:'val',id:'pm-cpu'},'0.0%'),
    el('div',{class:'sub'},'系统总占用'));
  const cardMem = el('div',{class:'card mem'},
    el('div',{class:'label'},'Memory'),
    el('div',{class:'val',id:'pm-mem'},'0'),
    el('div',{class:'sub'},'KB (所有进程)'));
  const cardMode = el('div',{class:'card mode live'},
    el('div',{class:'label'},'Scheduler'),
    el('div',{class:'val',id:'pm-mode'},'LIVE'),
    el('div',{class:'sub'},'调度模式'));
  const dash = el('div',{class:'pcb-mon-dash'}, cardProc, cardCpu, cardMem, cardMode);

  // ========== Body: list (left) + detail (right) ==========
  const listEl = el('div',{class:'pcb-mon-list'});
  const listHd = el('div',{class:'pcb-mon-list-hd'}, '进程控制块 · Process Control Block');
  const tableWrap = el('div',{class:'pcb-mon-table'});
  const tbl = el('table',{});
  tbl.appendChild(el('thead',{},
    el('tr',{},
      el('th',{},'PID'),
      el('th',{class:'col-u'},'USER'),
      el('th',{},'TYPE'),
      el('th',{},'TITLE'),
      el('th',{},'STATE'),
      el('th',{},'MEM'),
      el('th',{},'CPU_MS'),
      el('th',{class:'col-p'},'PC')
    )));
  const tbody = el('tbody',{});
  tbl.appendChild(tbody);
  tableWrap.appendChild(tbl);
  listEl.append(listHd, tableWrap);

  const detail = el('div',{class:'pcb-mon-detail'});

  const bodyEl = el('div',{class:'pcb-mon-body'}, listEl, detail);

  // ========== Toolbar (bottom) ==========
  const btnPause = el('button',{},'⏸ Pause');
  const btnStep = el('button',{disabled:true},'⏭ Step');
  const btnRefresh = el('button',{},'↻ Refresh');
  const tbar = el('div',{class:'pcb-mon-tbar'},
    btnPause, btnStep, btnRefresh,
    el('span',{class:'spacer'}),
    el('span',{class:'hint'},'提示：点击列表行查看该进程 PCB 详情（等价于终端 pcb <pid>）')
  );

  root.append(header, dash, bodyEl, tbar);
  body.appendChild(root);

  // ========== Format helpers ==========
  function fmtMs(ms){
    if(ms<1000) return ms+'ms';
    if(ms<60000) return (ms/1000).toFixed(1)+'s';
    if(ms<3600000) return (ms/60000).toFixed(1)+'m';
    return (ms/3600000).toFixed(1)+'h';
  }
  function fmtBytes(kb){
    if(kb<1024) return kb+'KB';
    return (kb/1024).toFixed(2)+'MB';
  }
  function bumpActivity(){ window._pcbActive = Date.now(); }

  // ========== Render ==========
  let selectedPid = null;

  function renderTable(){
    const all = PM.psList();
    tbody.innerHTML = '';
    if(all.length===0){
      tbody.appendChild(el('tr',{},
        el('td',{colspan:'8',class:'empty'},'(系统中暂无进程)'))
      );
      return;
    }
    all.forEach(p=>{
      const isSelf = p.pid === proc.pid;
      const tr = el('tr',{
        class: (selectedPid===p.pid?'sel':'') + (isSelf?' self':'')
      },
        el('td',{class:isSelf?'pid-val':''}, String(p.pid)),
        el('td',{class:'col-u'}, PCB_USER),
        el('td',{}, p.type),
        el('td',{}, p.title + (isSelf?' ★':'')),
        el('td',{}, el('span',{class:'st '+p.status}, p.status)),
        el('td',{}, p.memKB+' KB'),
        el('td',{}, fmtMs(p.cpuMs)),
        el('td',{class:'col-p'}, PCB_PC)
      );
      tr.addEventListener('click', ()=>{
        selectedPid = (selectedPid===p.pid) ? null : p.pid;
        bumpActivity();
        render();
      });
      tbody.appendChild(tr);
    });
  }

  function renderDetail(){
    detail.innerHTML = '';
    if(selectedPid===null){
      detail.appendChild(el('div',{class:'pcb-mon-detail-hd'},
        el('h4',{},'PCB 详情'),
        el('span',{class:'pid'},'未选中')
      ));
      detail.appendChild(el('div',{class:'empty'},

      ));
      return;
    }
    const info = PM.pcb(selectedPid);
    if(!info){
      detail.appendChild(el('div',{class:'pcb-mon-detail-hd'},
        el('h4',{},'PCB 详情'),
        el('span',{class:'pid'},'PID '+selectedPid)
      ));
      detail.appendChild(el('div',{class:'empty'},'该进程已退出，无法读取 PCB。'));
      return;
    }
    const isSelf = selectedPid === proc.pid;
    detail.appendChild(el('div',{class:'pcb-mon-detail-hd'},
      el('h4',{}, info.NAME),
      el('span',{class:'pid'},'PID '+info.PID + (isSelf?' · 本窗口 ★':''))
    ));
    const rows = [
      ['PID',     String(info.PID)],
      ['NAME',    info.NAME],
      ['USER',    PCB_USER],
      ['TYPE',    info.TYPE],
      ['STATE',   info.STATE],
      ['PC',      PCB_PC],
      ['MEM_KB',  info.MEM_KB+' KB ('+fmtBytes(info.MEM_KB)+')'],
      ['CPU_MS',  info.CPU_MS+'ms ('+fmtMs(info.CPU_MS)+')'],
      ['CPU_%',   info.CPU_PCT+'%'],
      ['PENDING', info.PENDING_MS+'ms'],
      ['UPTIME',  fmtMs(info.UPTIME_MS)],
    ];
    rows.forEach(([k,v])=>{
      detail.appendChild(el('div',{class:'kv'},
        el('span',{class:'key'}, k),
        el('span',{class:'val'}, v)
      ));
    });
    // Block / Wake actions (mirror 终端 `block <pid>` / `wake <pid>`)
    const actions = el('div',{class:'actions'});
    const btnBlock = el('button',{disabled: info.STATE!=='Running'},
      info.STATE==='Blocked'?'已 Blocked':'Block');
    btnBlock.onclick = ()=>{
      const r = PM.block(selectedPid);
      showTip(r); bumpActivity(); render();
    };
    const btnWake = el('button',{disabled: info.STATE!=='Blocked'}, 'Wake');
    btnWake.onclick = ()=>{
      const r = PM.wake(selectedPid);
      showTip(r); bumpActivity(); render();
    };
    actions.append(btnBlock, btnWake);
    detail.appendChild(actions);
  }

  function renderDash(){
    const all = PM.psList();
    const totalMem = PM.totalMem();
    $('#pm-cnt', root).textContent = all.length;
    $('#pm-cpu', root).textContent = PM.cpuPct.toFixed(1)+'%';
    $('#pm-mem', root).textContent = totalMem;
    const isLive = PM.mode==='live';
    cardMode.classList.toggle('live', isLive);
    cardMode.classList.toggle('manual', !isLive);
    $('#pm-mode', root).textContent = isLive?'LIVE':'MANUAL';
    badge.className = 'badge ' + (isLive?'live':'manual');
    badge.textContent = isLive?'● LIVE':'⏸ MANUAL';
    btnStep.disabled = isLive;
    btnPause.textContent = isLive?'⏸ Pause':'▶ Run';
  }

  function render(){
    renderDash();
    renderTable();
    renderDetail();
  }

  // ========== Toolbar handlers ==========
  btnPause.onclick = ()=>{
    const newMode = PM.mode==='live'?'manual':'live';
    const r = PM.setMode(newMode);
    showTip(r); bumpActivity(); render();
  };
  btnStep.onclick = ()=>{
    const r = PM.step();
    showTip(r); bumpActivity(); render();
  };
  btnRefresh.onclick = ()=>{
    showTip('已刷新'); bumpActivity(); render();
  };

  // ========== Initial render + 250ms polling ==========
  render();
  appInterval(proc, render, 250);
}

   =================================================================== */
function buildCalcMac(body, wm, yip, proc){
  const root = el('div',{class:'calc-mac'});
  const display = el('div',{class:'display'},'0');
  const grid = el('div',{class:'grid'});
  // mini status bar showing PID + MEM + CPU%
  const status = el('div',{style:'padding:6px 14px;background:#1c1c1e;color:#aaa;font-size:10px;font-family:"Courier New",monospace;display:flex;justify-content:space-between;border-top:1px solid #333'});
  root.append(display, grid, status);
  body.appendChild(root);
  const calc = {cur:'0', prev:null, op:null, fresh:true, eqCount:0};
  const baseMem = 512;
  proc.memKB = baseMem;
  function bumpMem(delta){ proc.memKB = baseMem + calc.eqCount; }
  function press(k){
    window._calcActive = Date.now();
    if(k>='0' && k<='9'){
      if(calc.fresh){ calc.cur=k; calc.fresh=false; }
      else calc.cur = calc.cur==='0'?k:calc.cur+k;
    } else if(k==='.'){
      if(calc.fresh){ calc.cur='0.'; calc.fresh=false; }
      else if(!calc.cur.includes('.')) calc.cur+='.';
    } else if(k==='C'){
      // 撤销/清空 -> 释放内存 (重置 eqCount)
      calc.cur='0'; calc.prev=null; calc.op=null; calc.fresh=true; calc.eqCount=0; bumpMem(0);
    } else if(k==='±'){
      calc.cur = (parseFloat(calc.cur)*-1).toString();
    } else if(k==='%'){
      calc.cur = (parseFloat(calc.cur)/100).toString();
    } else if(['+','-','×','÷'].includes(k)){
      if(calc.prev!==null && !calc.fresh) commit();
      calc.op=k; calc.prev=parseFloat(calc.cur); calc.fresh=true;
    } else if(k==='='){
      commit(); calc.op=null; calc.prev=null; calc.fresh=true; calc.eqCount++; bumpMem(0);
    }
    display.textContent = fmt(calc.cur);
    grid.querySelectorAll('.op').forEach(b=>b.classList.remove('active'));
    if(['+','-','×','÷'].includes(k)) [...grid.querySelectorAll('button')].find(b=>b.textContent===k)?.classList.add('active');
    refreshStatus();
  }
  function commit(){
    const a=calc.prev, b=parseFloat(calc.cur);
    let r=b;
    if(calc.op==='+') r=a+b;
    else if(calc.op==='-') r=a-b;
    else if(calc.op==='×') r=a*b;
    else if(calc.op==='÷') r=b===0?NaN:a/b;
    calc.cur = isNaN(r)?'Error':String(r);
  }
  function fmt(s){ s=String(s); if(s.length>12) s=parseFloat(s).toExponential(6); return s; }
  function refreshStatus(){
    status.innerHTML = `<span>PID ${proc.pid} · ${proc.status}</span><span>MEM ${proc.memKB}KB · CPU ${PM.cpuPct.toFixed(1)}%</span>`;
  }
  const keys = [
    ['C','±','%','÷'],
    ['7','8','9','×'],
    ['4','5','6','-'],
    ['1','2','3','+'],
    ['0','.','=']   // 0 用 .zero 类跨 2 列 → 实际占 4 列：0(2)+.(1)+=(1)
  ];
  keys.forEach(row=>row.forEach(k=>{
    let cls='';
    if(['÷','×','-','+','='].includes(k)) cls='op';
    else if(['C','±','%'].includes(k)) cls='fn';
    const b = el('button',{class:cls,onclick:()=>press(k)},k);
    if(k==='0') b.classList.add('zero');
    grid.appendChild(b);
  }));
  body.addEventListener('keydown',e=>{
    if(/[0-9]/.test(e.key)) press(e.key);
    else if(e.key==='.') press('.');
    else if(e.key==='+') press('+');
    else if(e.key==='-') press('-');
    else if(e.key==='*') press('×');
    else if(e.key==='/') press('÷');
    else if(e.key==='Enter'||e.key==='=') press('=');
    else if(e.key==='Backspace') press('C');
    else if(e.key.toLowerCase()==='c') press('C');
  });
  appInterval(proc, refreshStatus, 500);
  refreshStatus();
}
function buildCalcWin(body, wm, yip, proc){
  const root = el('div',{class:'calc-w98'});
  const menu = el('div',{class:'menu'},
    el('span',{onclick:()=>showTip('复制当前结果')},'编辑(E)'),
    el('span',{onclick:()=>showTip('查看帮助')},'帮助(H)'),
  );
  const display = el('div',{class:'display-w98'},'0');
  const grid = el('div',{class:'grid'});
  const status = el('div',{style:'padding:2px 6px;font-size:11px;font-family:"Courier New",monospace;color:#000;border-top:1px solid #808080;background:#c0c0c0;display:flex;justify-content:space-between'});
  root.append(menu, display, grid, status);
  body.appendChild(root);
  const calc={cur:'0',prev:null,op:null,fresh:true,eqCount:0};
  const baseMem=512; proc.memKB=baseMem;
  function refreshStatus(){ status.innerHTML = `<span>PID ${proc.pid}·${proc.status}</span><span>MEM ${proc.memKB}KB·CPU ${PM.cpuPct.toFixed(1)}%</span>`; }
  function press(k){
    window._calcActive = Date.now();
    if(k>='0' && k<='9'){
      if(calc.fresh){calc.cur=k;calc.fresh=false;}
      else calc.cur = calc.cur==='0'?k:calc.cur+k;
    } else if(k==='.'){
      if(calc.fresh){calc.cur='0.';calc.fresh=false;}
      else if(!calc.cur.includes('.')) calc.cur+='.';
    } else if(k==='C'){calc.cur='0';calc.prev=null;calc.op=null;calc.fresh=true;calc.eqCount=0;proc.memKB=baseMem;} // 撤销/清空 释放内存
    else if(k==='CE'){calc.cur='0';calc.fresh=true;}
    else if(k==='←'){calc.cur=calc.cur.length>1?calc.cur.slice(0,-1):'0';}
    else if(k==='±'){calc.cur=(parseFloat(calc.cur)*-1).toString();}
    else if(k==='1/x'){calc.cur=calc.cur==='0'?'Error':(1/parseFloat(calc.cur)).toString();}
    else if(k==='√'){calc.cur=Math.sqrt(parseFloat(calc.cur)).toString();}
    else if(k==='%'){calc.cur=(parseFloat(calc.cur)/100).toString();}
    else if(['+','-','*','/'].includes(k)){
      if(calc.prev!==null && !calc.fresh) commit();
      calc.op=k; calc.prev=parseFloat(calc.cur); calc.fresh=true;
    } else if(k==='='){commit();calc.op=null;calc.prev=null;calc.fresh=true;calc.eqCount++;proc.memKB=baseMem+calc.eqCount;}
    display.textContent = fmt(calc.cur);
    refreshStatus();
  }
  function commit(){
    const a=calc.prev, b=parseFloat(calc.cur), op=calc.op;
    let r=b;
    if(op==='+') r=a+b;
    else if(op==='-') r=a-b;
    else if(op==='*') r=a*b;
    else if(op==='/') r=b===0?NaN:a/b;
    calc.cur = isNaN(r)?'Error':String(r);
  }
  function fmt(s){s=String(s); if(s.length>14) s=parseFloat(s).toExponential(6); return s;}
  const keys = [
    ['C','CE','←','±','√'],
    ['7','8','9','/','%'],
    ['4','5','6','*','1/x'],
    ['1','2','3','-','back'],
    ['0','.','=','+','']   // 0 和 = 各跨 2 列（用 span 类）；最后 1 列为空
  ];
  keys.forEach(row=>row.forEach((k,idx)=>{
    if(k===''||k==='back') { grid.appendChild(el('span')); return; }
    const b = el('button',{onclick:()=>press(k)},k);
    if(['*','/','-','+','='].includes(k)) b.classList.add('op');
    if(k==='0') b.classList.add('w-zero');    // 0 跨 2 列
    if(k==='=') b.classList.add('w-eq');      // = 跨 2 列
    grid.appendChild(b);
  }));
  appInterval(proc, refreshStatus, 500);
  refreshStatus();
}

function buildMineMac(body, wm, yip, proc){
  const root = el('div',{class:'mine-mac'});
  const toolbar = el('div',{class:'toolbar'},
    el('div',{class:'stat', id:'m-stat-mine'},'010'),
    el('div',{class:'face', id:'m-face'},'🙂'),
    el('div',{class:'stat', id:'m-stat-time'},'000'),
  );
  const grid = el('div',{class:'grid'});
  const status = el('div',{style:'flex:0 0 auto;padding:6px 10px;font-size:11px;font-family:"Courier New",monospace;color:#555;display:flex;justify-content:space-between'});
  root.append(toolbar, grid, status);
  body.appendChild(root);
  const ROWS=10, COLS=10, MINES=15;
  const baseMem=1024;
  proc.memKB = baseMem;
  function refreshStatus(){ status.innerHTML = `<span>PID ${proc.pid}·${proc.status}</span><span>STEP ${state?.steps||0}·MEM ${proc.memKB}KB·CPU ${PM.cpuPct.toFixed(1)}%</span>`; }
  let board, state, time, timer;
  function newGame(){
    // 重开 -> 释放内存
    proc.memKB = baseMem;
    // 布雷：使用确定性伪随机，避免 Math.random
    let seed = (proc.pid*7919 + 2473) | 0;
    function r(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed; }
    board=Array.from({length:ROWS},()=>Array(COLS).fill(null).map(()=>({mine:false,open:false,flag:false,n:0})));
    let placed=0;
    while(placed<MINES){const rr=r()%ROWS, cc=r()%COLS;
      if(!board[rr][cc].mine){board[rr][cc].mine=true;placed++;}
    }
    for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(!board[rr][cc].mine){
      let n=0; for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=rr+dr,nc=cc+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc].mine)n++;}
      board[rr][cc].n=n;
    }
    state={over:false,win:false,flagCount:0,face:'🙂',steps:0};
    time=0; clearInterval(timer);
    render();
    if(timer)clearInterval(timer); // 重开时先清旧计时器，避免叠加
    timer=appInterval(proc, ()=>{ if(!state.over){time++; upd(); } },1000);
    refreshStatus();
  }
  function upd(){
    $('#m-stat-mine',root).textContent = String(MINES-state.flagCount).padStart(3,'0');
    $('#m-stat-time',root).textContent = String(Math.min(time,999)).padStart(3,'0');
    $('#m-face',root).textContent = state.face;
    refreshStatus();
  }
  function open(r,c){
    if(state.over) return;
    if(board[r][c].flag) return;
    if(board[r][c].open) return;
    if(board[r][c].mine){ state.over=true; state.face='😵'; reveal(); timer&&clearInterval(timer); upd(); return; }
    // 每走一步 +1 KiB
    state.steps++;
    proc.memKB = baseMem + state.steps;
    window._mineActive = Date.now();
    flood(r,c);
    checkWin();
  }
  function flood(r,c){
    if(r<0||c<0||r>=ROWS||c>=COLS) return;
    if(board[r][c].open||board[r][c].flag) return;
    board[r][c].open=true;
    if(board[r][c].n===0){
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc) flood(r+dr,c+dc);
    }
    render();
  }
  function toggleFlag(r,c){
    if(state.over || board[r][c].open) return;
    board[r][c].flag = !board[r][c].flag;
    state.flagCount += board[r][c].flag?1:-1;
    render(); upd();
  }
  function checkWin(){
    let safe=0;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c].open) safe++;
    if(safe===ROWS*COLS-MINES){ state.win=true; state.over=true; state.face='😎'; timer&&clearInterval(timer); upd(); }
  }
  function reveal(){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(board[r][c].mine) board[r][c].open=true;
    }
    render();
  }
  function render(){
    // ★ 行列都显式给出：只设列时行高会被 cell 的固有尺寸/aspect-ratio 撑爆，导致底部被裁
    grid.style.gridTemplateColumns = `repeat(${COLS},minmax(0,1fr))`;
    grid.style.gridTemplateRows    = `repeat(${ROWS},minmax(0,1fr))`;
    grid.innerHTML='';
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const cell=board[r][c];
      const div = el('div',{class:'cell'});
      if(cell.open){
        div.classList.add('open');
        if(cell.mine){ div.classList.add('mine'); }
        else if(cell.n>0) { div.classList.add('n'+cell.n); div.textContent = cell.n; }
      } else if(cell.flag){ div.classList.add('flag'); }
      const click = (e)=>{ e.preventDefault(); if(e.button===2) toggleFlag(r,c); else {state.face='😮';upd();open(r,c);} };
      div.addEventListener('click', click);
      div.addEventListener('contextmenu', click);
      grid.appendChild(div);
    }
  }
  $('#m-face',root).addEventListener('click', ()=>{ newGame(); });
  appInterval(proc, refreshStatus, 500);
  newGame();
}
