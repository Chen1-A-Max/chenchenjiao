function buildPaintMac(body, wm, yip, proc){
  const root = document.createElement('div');
  root.style.cssText = 'display:flex;flex-direction:column;height:100%;background:linear-gradient(180deg,#fafafa,#e8e8ea);font-family:-apple-system,sans-serif;';
  // 工具栏
  const toolbar = document.createElement('div');
  toolbar.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,0,0,.1);';
  const colors = ['#000000','#ffffff','#ff3b30','#ff9500','#ffcc00','#34c759','#5ac8fa','#5856d6','#af52de','#8e8e93'];
  const sizeLabel = document.createElement('span');
  sizeLabel.textContent = '粗细:';
  sizeLabel.style.cssText = 'font-size:12px;color:#333;';
  const sizeSlider = document.createElement('input');
  sizeSlider.type = 'range'; sizeSlider.min = '1'; sizeSlider.max = '30'; sizeSlider.value = '4';
  sizeSlider.style.cssText = 'width:100px;';
  toolbar.appendChild(sizeLabel);
  toolbar.appendChild(sizeSlider);
  const swatchWrap = document.createElement('div');
  swatchWrap.style.cssText = 'display:flex;gap:4px;margin-left:8px;border-left:1px solid #ccc;padding-left:12px;';
  let curColor = colors[0];
  colors.forEach(c=>{
    const sw = document.createElement('div');
    sw.style.cssText = `width:18px;height:18px;border-radius:50%;background:${c};border:2px solid ${c===curColor?'#000':'#ddd'};cursor:pointer;`;
    sw.addEventListener('click',()=>{
      curColor = c;
      swatchWrap.querySelectorAll('div').forEach(x=>x.style.border='2px solid '+x.style.background);
      sw.style.border = '2px solid #000';
    });
    swatchWrap.appendChild(sw);
  });
  toolbar.appendChild(swatchWrap);
  const undoBtn = document.createElement('button');
  undoBtn.textContent = '↶ 撤销';
  undoBtn.style.cssText = 'padding:4px 12px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;font-size:12px;';
  const clearBtn = document.createElement('button');
  clearBtn.textContent = '🗑 清空';
  clearBtn.style.cssText = 'padding:4px 12px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;font-size:12px;margin-left:auto;';
  toolbar.appendChild(undoBtn);
  toolbar.appendChild(clearBtn);
  // 状态栏
  const status = document.createElement('div');
  status.style.cssText = 'padding:5px 12px;font-size:11px;font-family:"Courier New",monospace;color:#555;background:#f0f0f0;border-top:1px solid #ddd;display:flex;justify-content:space-between';
  // 画布
  const canvasWrap = document.createElement('div');
  canvasWrap.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;background:#e8e8ea;padding:12px;overflow:auto;';
  const canvas = document.createElement('canvas');
  canvas.width = 680; canvas.height = 420;
  canvas.style.cssText = 'background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:crosshair;';
  const ctx = canvas.getContext('2d');
  if(ctx){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  canvasWrap.appendChild(canvas);
  root.appendChild(toolbar);
  root.appendChild(canvasWrap);
  root.appendChild(status);
  body.appendChild(root);

  // 笔画历史 + 内存模型
  const baseMem = 8192;
  proc.memKB = baseMem;
  let strokes = 0, dots = 0;
  const history = []; // 每笔 [{x,y,r,color}]
  function pushStroke(pt){
    history.push(pt);
    strokes++;
    // 每次落笔 +1KB，每点 +1KB（简化版，对应速查表精神）
    proc.memKB = baseMem + strokes + dots;
    refreshStatus();
  }
  function refreshStatus(){
    status.innerHTML = `<span>PID ${proc.pid} · ${proc.status}</span><span>笔 ${strokes} · 点 ${dots} · MEM ${proc.memKB}KB · CPU ${PM.cpuPct.toFixed(1)}%</span>`;
  }

  let drawing = false, lastX = 0, lastY = 0;
  canvas.addEventListener('mousedown',(e)=>{
    e.stopPropagation();
    window._paintActive = Date.now();
    drawing = true;
    const r = canvas.getBoundingClientRect();
    lastX = e.clientX - r.left;
    lastY = e.clientY - r.top;
    dots++;
    pushStroke({x:lastX,y:lastY,r:parseInt(sizeSlider.value),color:curColor});
    ctx.fillStyle = curColor;
    ctx.beginPath();
    ctx.arc(lastX,lastY,parseInt(sizeSlider.value)/2,0,Math.PI*2);
    ctx.fill();
  });
  canvas.addEventListener('mousemove',(e)=>{
    if(!drawing) return;
    e.stopPropagation();
    window._paintActive = Date.now();
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    ctx.strokeStyle = curColor;
    ctx.lineWidth = parseInt(sizeSlider.value);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    lastX = x; lastY = y;
  });
  ['mouseup','mouseleave'].forEach(ev=>{
    canvas.addEventListener(ev, ()=>{
      drawing = false;
    });
  });

  undoBtn.addEventListener('click',()=>{
    if(history.length===0){ showTip('没有可撤销的笔画'); return; }
    history.pop();
    strokes = Math.max(0, strokes-1);
    // 重绘
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    history.forEach(p=>{
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r/2,0,Math.PI*2);
      ctx.fill();
    });
    proc.memKB = baseMem + strokes + dots;
    refreshStatus();
  });
  clearBtn.addEventListener('click',()=>{
    if(history.length===0 && dots===0) return;
    history.length = 0;
    strokes = 0; dots = 0;
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    proc.memKB = baseMem;  // 清空 → 释放到基数
    refreshStatus();
    showTip('画布已清空，内存已释放');
  });

  refreshStatus();
  appInterval(proc, refreshStatus, 500);
}
function buildPaintWin(body, wm, yip, proc){
  // Win98 风格画图（更朴素）
  const root = document.createElement('div');
  root.style.cssText = 'display:flex;flex-direction:column;height:100%;background:#c0c0c0;font-family:"MS Sans Serif",Tahoma,sans-serif;font-size:12px;';
  // 菜单
  const menu = document.createElement('div');
  menu.style.cssText = 'padding:2px 4px;border-bottom:1px solid #808080;background:#c0c0c0;';
  ['文件(F)','编辑(E)','查看(V)','图像(I)','颜色(C)','帮助(H)'].forEach(t=>{
    const s = document.createElement('span');
    s.textContent = t; s.style.cssText = 'margin-right:12px;cursor:pointer;padding:1px 4px;';
    s.addEventListener('click',()=>showTip(t+' 菜单'));
    s.addEventListener('mouseenter',()=>s.style.background='#000080');
    s.addEventListener('mouseleave',()=>s.style.background='transparent');
    s.addEventListener('mouseenter',()=>s.style.color='#fff');
    s.addEventListener('mouseleave',()=>s.style.color='#000');
    menu.appendChild(s);
  });
  // 工具栏
  const tb = document.createElement('div');
  tb.style.cssText = 'display:flex;align-items:center;gap:6px;padding:4px 6px;background:#c0c0c0;border-bottom:1px solid #808080;';
  const colors = ['#000000','#7f7f7f','#880015','#ed1c24','#ff7f27','#fff200','#22b14c','#00a2e8','#3f48cc','#a349a4'];
  const swatchWrap = document.createElement('div');
  swatchWrap.style.cssText = 'display:grid;grid-template-columns:repeat(10,16px);gap:1px;padding:2px;background:#fff;border:1px solid #808080;';
  let curColor = '#000000';
  colors.forEach(c=>{
    const sw = document.createElement('div');
    sw.style.cssText = `width:16px;height:16px;background:${c};cursor:pointer;`;
    sw.addEventListener('click',()=>{ curColor = c; swatchWrap.querySelectorAll('div').forEach(x=>x.style.outline=''); sw.style.outline='2px solid #000'; });
    swatchWrap.appendChild(sw);
  });
  tb.appendChild(swatchWrap);
  // 清空按钮
  const clearBtn = document.createElement('button');
  clearBtn.textContent = '清空';
  clearBtn.style.cssText = 'padding:2px 10px;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #404040;border-bottom:1px solid #404040;background:#c0c0c0;cursor:pointer;margin-left:auto;';
  clearBtn.addEventListener('click',()=>{ ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); proc.memKB=8192; history.length=0; strokes=0; dots=0; refreshStatus(); showTip('画布已清空'); });
  tb.appendChild(clearBtn);
  // 状态栏
  const status = document.createElement('div');
  status.style.cssText = 'padding:2px 6px;border-top:1px solid #fff;font-family:"Lucida Console",monospace;font-size:11px;';
  // 画布
  const canvasWrap = document.createElement('div');
  canvasWrap.style.cssText = 'flex:1;background:#808080;padding:8px;display:flex;align-items:center;justify-content:center;overflow:auto;';
  const c = document.createElement('canvas');
  c.width = 640; c.height = 380;
  c.style.cssText = 'background:#fff;border:1px solid #fff;cursor:crosshair;';
  const ctx = c.getContext('2d');
  if(ctx){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); }
  canvasWrap.appendChild(c);
  root.appendChild(menu);
  root.appendChild(tb);
  root.appendChild(canvasWrap);
  root.appendChild(status);
  body.appendChild(root);

  const baseMem = 8192;
  proc.memKB = baseMem;
  let strokes = 0, dots = 0;
  const history = [];
  function refreshStatus(){
    status.innerHTML = `PID ${proc.pid} · ${proc.status}  |  笔 ${strokes} · 点 ${dots} · MEM ${proc.memKB}KB · CPU ${PM.cpuPct.toFixed(1)}%`;
  }
  let drawing = false, lx=0, ly=0;
  c.addEventListener('mousedown',(e)=>{
    e.stopPropagation();
    window._paintActive = Date.now();
    drawing = true;
    const r = c.getBoundingClientRect();
    lx = e.clientX-r.left; ly = e.clientY-r.top;
    dots++; strokes++;
    history.push({x:lx,y:ly,r:2,color:curColor});
    proc.memKB = baseMem + strokes + dots;
    ctx.fillStyle = curColor;
    ctx.fillRect(lx,ly,2,2);
    refreshStatus();
  });
  c.addEventListener('mousemove',(e)=>{
    if(!drawing) return;
    e.stopPropagation();
    window._paintActive = Date.now();
    const r = c.getBoundingClientRect();
    const x = e.clientX-r.left, y = e.clientY-r.top;
    ctx.strokeStyle = curColor; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke();
    lx = x; ly = y;
  });
  ['mouseup','mouseleave'].forEach(ev=>c.addEventListener(ev,()=>drawing=false));
  refreshStatus();
  appInterval(proc, refreshStatus, 500);
}

/* ===================================================================
   虚拟文件系统 VFS —— 终端 cd / mkdir(MD) / echo> / type(cat) 的真实数据源
   内部统一以 "/" 分隔存储（Win 盘符作为首段：C:/WINDOWS）；
   Win 侧键名统一大写（DOS 大小写不敏感），显示时还原成 C:\WINDOWS
   =================================================================== */
const virtualFS = {};                      /* Win98 虚拟文件表：路径 -> 节点 */
const VFS = { mac:{}, win: virtualFS };    /* macOS 与 Win98 各自一棵树 */

/* 路径归一化：\ -> /，压缩重复斜杠，去尾部斜杠（保留根 "/"） */
function vfsNorm(p){
  let s = String(p==null?'':p).trim().replace(/\\/g,'/').replace(/\/{2,}/g,'/');
  if(s.length>1) s = s.replace(/\/+$/,'');
  return s;
}
/* 树键：Win 侧大写（大小写不敏感），macOS 侧保留原样 */
function vfsKey(style,p){ const s=vfsNorm(p); return style==='win'?s.toUpperCase():s; }
function vfsParts(p){ return vfsNorm(p).split('/').filter(x=>x!==''); }
function vfsBuild(style, parts){
  if(style==='win') return parts.length? parts.join('/') : 'C:';
  return '/'+parts.join('/');
}
/* 展示形态：Win 还原反斜杠，macOS 保持斜杠 */
function vfsShow(style,p){
  const s=vfsNorm(p);
  if(style==='win') return (s==='C:'?'C:\\':s.replace(/\//g,'\\'));
  return s;
}
function vfsTree(style){ return style==='win'?VFS.win:VFS.mac; }
function vfsGet(style,p){ return vfsTree(style)[vfsKey(style,p)]||null; }

/* 路径解析：支持 ~ / . / .. / 绝对路径 / Win 盘符 */
function vfsResolve(style, cur, arg){
  const curParts = vfsParts(cur);
  let a = (arg==null?'':String(arg).trim().replace(/\\/g,'/'));
  if(a==='') return vfsBuild(style, curParts.length?curParts:(style==='win'?['C:']:[]));
  let start;
  if(a==='~'||a.indexOf('~/')===0){
    start = vfsParts(style==='win'?USER.winHome:USER.home);
    a = a.length>1?a.slice(2):'';
  } else if(style==='win' && /^[A-Za-z]:/.test(a)){
    start=[a.slice(0,2).toUpperCase()]; a=a.slice(2).replace(/^\//,'');
  } else if(a.charAt(0)==='/'){
    start = style==='win'?[curParts[0]||'C:']:[];
    a=a.replace(/^\//,'');
  } else start = curParts.slice();
  a.split('/').forEach(seg=>{
    if(seg===''||seg==='.') return;
    if(seg==='..'){ if(style==='win'? start.length>1 : start.length) start.pop(); return; }
    start.push(seg);
  });
  return vfsBuild(style,start);
}
/* 自动补齐缺失的父目录 */
function vfsEnsureParents(style, parts){
  const t=vfsTree(style);
  for(let i=1;i<parts.length;i++){
    const k=vfsKey(style, vfsBuild(style,parts.slice(0,i)));
    if(!t[k]) t[k]={type:'dir',name:parts[i-1],content:''};
  }
}
function vfsMkdir(style,path){
  const t=vfsTree(style), p=vfsNorm(path), parts=vfsParts(p);
  if(!parts.length) return {ok:false,msg:'无法创建根目录'};
  if(t[vfsKey(style,p)]) return {ok:false,msg:'目录已存在: '+vfsShow(style,p)};
  vfsEnsureParents(style,parts);
  t[vfsKey(style,p)]={type:'dir',name:parts[parts.length-1],content:''};
  return {ok:true,msg:'已创建目录 '+vfsShow(style,p)};
}
function vfsWrite(style,path,content){
  const t=vfsTree(style), p=vfsNorm(path), parts=vfsParts(p);
  if(!parts.length) return {ok:false,msg:'无效的文件名'};
  const k=vfsKey(style,p);
  if(t[k] && t[k].type==='dir') return {ok:false,msg:vfsShow(style,p)+' 是一个目录'};
  vfsEnsureParents(style,parts);
  const existed=!!t[k];
  t[k]={type:'file',name:parts[parts.length-1],content:String(content)};
  return {ok:true,msg:(existed?'已覆盖文件 ':'已写入文件 ')+vfsShow(style,p)+'  ('+String(content).length+' 字节)'};
}
/* 列目录：返回 {dirs,files} / {file,node} / null(不存在) */
function vfsList(style,path){
  const t=vfsTree(style), pk=vfsKey(style,path);
  if(!t[pk]) return null;
  if(t[pk].type==='file') return {file:true, node:t[pk]};
  const dirs=[], files=[];
  Object.keys(t).forEach(k=>{
    const n=t[k];
    const parentKey = vfsKey(style, vfsBuild(style, vfsParts(k).slice(0,-1)));
    if(parentKey!==pk) return;
    (n.type==='dir'?dirs:files).push(n);
  });
  const cmp=(a,b)=>String(a.name).localeCompare(String(b.name));
  dirs.sort(cmp); files.sort(cmp);
  return {dirs,files};
}
/* 解析重定向：echo 文本 > file  /  echo 文本 >> file */
function splitRedirect(raw){
  const m = String(raw).match(/^(.*?)\s*(>>|>)\s*(.+)$/);
  if(!m) return null;
  return {body:m[1].trim(), file:m[3].trim(), append:m[2]==='>>'};
}
/* 初始化种子目录（macOS 主目录 + Win98 C: 盘） */
function vfsSeed(){
  const md=(t,p,name)=>{ t[vfsNorm(p)]={type:'dir',name:name,content:''}; };
  const mf=(t,p,name,c)=>{ t[vfsNorm(p)]={type:'file',name:name,content:c}; };
  const home = USER.home;
  md(VFS.mac,'/','/');
  md(VFS.mac,'/Users','Users');
  md(VFS.mac, home, USER.name);
  md(VFS.mac, home+'/Documents','Documents');
  md(VFS.mac, home+'/Downloads','Downloads');
  md(VFS.mac, home+'/Desktop','Desktop');
  md(VFS.mac, home+'/Music','Music');
  md(VFS.mac,'/Applications','Applications');
  mf(VFS.mac, home+'/note.txt','note.txt','我是张三');
  mf(VFS.mac, home+'/Documents/README.txt','README.txt','欢迎使用 macOS 终端演示。\n输入 help 查看全部命令。');
  mf(VFS.mac, home+'/Desktop/hello.txt','hello.txt','Hello, '+USER.full+'!');

  md(VFS.win,'C:','C:');
  md(VFS.win,'C:/WINDOWS','WINDOWS');
  md(VFS.win,'C:/WINDOWS/SYSTEM','SYSTEM');
  md(VFS.win,'C:/WINDOWS/SYSTEM32','SYSTEM32');
  md(VFS.win,'C:/PROGRAM FILES','PROGRAM FILES');
  md(VFS.win,'C:/MY DOCUMENTS','MY DOCUMENTS');
  md(VFS.win,'C:/GAMES','GAMES');
  mf(VFS.win,'C:/AUTOEXEC.BAT','AUTOEXEC.BAT','@ECHO OFF\nPATH C:\\WINDOWS;C:\\WINDOWS\\COMMAND');
  mf(VFS.win,'C:/CONFIG.SYS','CONFIG.SYS','DEVICE=C:\\WINDOWS\\HIMEM.SYS');
  mf(VFS.win,'C:/WINDOWS/README.TXT','README.TXT','Windows 98 演示系统');
}
vfsSeed();

function buildTermMac(body, wm, yip, proc){
  const root = el('div',{class:'term-mac'});
  const title = el('div',{class:'term-title'},
    el('span',{class:'dot r'}), el('span',{class:'dot y'}), el('span',{class:'dot g'}),
    el('span',{},'  '+USER.name+'@'+USER.macHost+' — bash — 80×24')
  );
  const out = el('div',{class:'term-body'});
  const promptEl = el('span',{class:'prompt'},USER.name+'@'+USER.macHost+' ~ $');
  const inp = el('div',{class:'term-input'},
    promptEl,
    el('input',{type:'text',autocomplete:'off',spellcheck:false})
  );
  root.append(title, out, inp);
  body.appendChild(root);
  const input = inp.querySelector('input');
  let history=[], hIdx=-1;
  /* ★ 真实当前路径，初始为用户主目录 */
  let currentPath = vfsNorm(USER.home);
  const HOME_KEY = vfsKey('mac', USER.home);
  function updPrompt(){
    let show;
    if(vfsKey('mac',currentPath)===HOME_KEY) show='~';
    else if(vfsNorm(currentPath).indexOf(vfsNorm(USER.home)+'/')===0) show='~'+currentPath.slice(vfsNorm(USER.home).length);
    else show = currentPath;
    promptEl.textContent = USER.name+'@'+USER.macHost+' '+show+' $';
  }
  updPrompt();
  /* ★ 初始化本终端的虚拟文件表 virtualFS：默认包含 note.txt */
  const virtualFS = {
    'note.txt': '我是张三'
  };
  function vfsInit(){
    // 同步写进全局 VFS 的主目录与 Documents，保证 ls / cat / type 都能看到
    [USER.home, USER.home+'/Documents'].forEach(dir=>{
      vfsWrite('mac', vfsResolve('mac', dir, 'note.txt'), virtualFS['note.txt']);
    });
  }
  vfsInit();
  /* 取路径基名，用于 virtualFS 键 */
  const baseName = p=>String(p).replace(/\\/g,'/').split('/').filter(Boolean).pop() || String(p);
  function outLine(txt, cls=''){ const ln=el('div',{class:'ln'+(cls?' '+cls:'')},txt); out.appendChild(ln); out.scrollTop=out.scrollHeight; }
  function runCmd(cmd){
    window._termActive = Date.now();
    cmd = cmd.trim();
    outLine(promptEl.textContent+' '+cmd,'cmd');
    if(!cmd) return;
    history.push(cmd); hIdx=history.length;
    const parts = cmd.split(/\s+/);
    const c0 = parts[0].toLowerCase();
    switch(c0){
      case 'help':
        outLine('可用命令：','ok');
        outLine(' 文件系统：','help');
        outLine('  ls [目录]              列出目录内容（真实 VFS）','ln');
        outLine('  cd <目录>              切换目录，支持 .. 与 ~','ln');
        outLine('  cd / cd ~              回到主目录 '+USER.home,'ln');
        outLine('  pwd                    显示当前路径','ln');
        outLine('  mkdir <目录名>         创建目录（可用 md）','ln');
        outLine('  type <文件>            显示文件内容（cat 同义）','ln');
        outLine('  echo 文本 > 文件       写入文件，>> 为追加','ln');
        outLine(' 系统与应用：','help');
        outLine('  whoami, date/time, history, clear, apps, open <应用>, exit','ln');
        outLine('  ps [all], pcb <pid>, block <pid>, wake <pid>, kill <pid>','ln');
        outLine('  mode manual|live, step, theme macos|win98, restart','ln');
        break;
      case 'clear': out.innerHTML=''; break;
      case 'echo': {
        const rd = splitRedirect(cmd);
        if(rd){
          const text = rd.body.replace(/^echo\s*/i,'').replace(/^"([\s\S]*)"$/, '$1');
          const target = vfsResolve('mac', currentPath, rd.file);
          const oldN = vfsGet('mac', target);
          const old = rd.append ? ((oldN && oldN.type==='file' && oldN.content) || '') : '';
          const r = vfsWrite('mac', target, old + text);
          if(r.ok) virtualFS[baseName(rd.file)] = old + text;   // ★ 同步 virtualFS
          outLine(' '+r.msg, r.ok?'ok':'err');
        } else outLine(' '+cmd.replace(/^echo\s*/i,''),'ln');
        break;
      }
      case 'pwd': outLine(' '+currentPath,'ln'); break;
      case 'cd': {
        const arg = parts.slice(1).join(' ');
        const target = vfsResolve('mac', currentPath, arg);
        const n = vfsGet('mac', target);
        if(!n){ outLine(' cd: no such file or directory: '+(arg||'(空)'),'err'); break; }
        if(n.type!=='dir'){ outLine(' cd: not a directory: '+arg,'err'); break; }
        currentPath = target; updPrompt();
        break;
      }
      case 'md':
      case 'mkdir': {
        const arg = parts.slice(1).join(' ');
        if(!arg){ outLine(' 用法: mkdir <目录名>','warn'); break; }
        const r = vfsMkdir('mac', vfsResolve('mac', currentPath, arg));
        outLine(' '+r.msg, r.ok?'ok':'err');
        break;
      }
      case 'type':
      case 'cat': {
        const arg = parts.slice(1).join(' ');
        if(!arg){ outLine(' 用法: type <文件名>','warn'); break; }
        let n = vfsGet('mac', vfsResolve('mac', currentPath, arg));
        // ★ 兜底：virtualFS 里有同名条目则直接采用（并回写进 VFS）
        if(!n && Object.prototype.hasOwnProperty.call(virtualFS, baseName(arg))){
          vfsWrite('mac', vfsResolve('mac', currentPath, arg), virtualFS[baseName(arg)]);
          n = vfsGet('mac', vfsResolve('mac', currentPath, arg));
        }
        if(!n){ outLine(' cat: '+arg+': No such file or directory','err'); break; }
        if(n.type==='dir'){ outLine(' cat: '+arg+': Is a directory','err'); break; }
        if(!n.content){ outLine(' （空文件）','warn'); break; }
        n.content.split('\n').forEach(l=>outLine(' '+l,'ln'));
        break;
      }
      case 'whoami': outLine(' '+WHOAMI(),'ok'); break;
      case 'date':
      case 'time': outLine(' '+new Date().toString(),'ln'); break;
      case 'history':
        history.forEach((h,i)=>outLine(' '+String(i+1).padStart(3,' ')+'  '+h,'ln'));
        if(!history.length) outLine(' (空)','warn');
        break;
      case 'ls': {
        const arg = parts.slice(1).join(' ');
        const target = vfsResolve('mac', currentPath, arg);
        const r = vfsList('mac', target);
        if(!r){ outLine(' ls: '+(arg||'.')+': No such file or directory','err'); break; }
        if(r.file){ outLine(' '+r.node.name,'ln'); break; }
        const all = r.dirs.map(n=>n.name+'/').concat(r.files.map(n=>n.name));
        if(!all.length){ outLine(' （空目录）','warn'); break; }
        outLine(' '+all.join('   '),'ln');
        outLine(' 共 '+r.dirs.length+' 个目录，'+r.files.length+' 个文件','help');
        break;
      }
      case 'apps': outLine(' 已安装应用： Finder, Process Monitor, Calculator, Minesweeper, Terminal','ln'); break;
      case 'open': {
        const app = parts[1];
        // 支持别名 paint=画图应用, game=mine, computer=calc
        const alias = {game:'mine',computer:'calc',draw:'paint'};
        const real = alias[app] || app;
        if(['finder','pcb','calc','mine','term','paint'].includes(real)){ window.WM.open(real); outLine(' 已打开 '+real,'ok'); }
        else outLine(' 未知应用：'+app+' (可用: finder|pcb|calc|mine|term|paint|game|computer|draw)','err');
        break;
      }
      case 'theme':
        if(parts[1]==='win98'){ switchOS('win98'); outLine(' 已切换到 Windows 98','ok'); }
        else if(parts[1]==='macos'){ switchOS('macos'); outLine(' 已切换到 macOS','ok'); }
        else outLine(' 用法: theme macos|win98','warn');
        break;
      case 'mode': {
        const m = parts[1]==='manual'?'manual':(parts[1]==='live'?'live':null);
        if(!m){ outLine(' 用法: mode manual|live','warn'); break; }
        outLine(' '+PM.setMode(m),'ok');
        break;
      }
      case 'step': outLine(' '+PM.step(),'ok'); break;
      case 'ps': {
        const all = parts[1]==='all';
        outLine(' PID  TYPE       TITLE                     STATE    MEM    CPU_MS  CPU%','ok');
        PM.psList().forEach(p=>{
          outLine(` ${String(p.pid).padEnd(4)} ${p.type.padEnd(10)} ${p.title.padEnd(24).slice(0,24)} ${p.status.padEnd(8)} ${String(p.memKB).padEnd(5)}KB ${String(p.cpuMs).padEnd(6)}ms ${PM.cpuPct.toFixed(1)}%`,'ln');
        });
        if(!PM.psList().length) outLine(' (空)','warn');
        if(all) outLine(`总内存: ${PM.totalMem()}KB  模式: ${PM.mode}  系统CPU%: ${PM.cpuPct.toFixed(1)}`,'ln');
        break;
      }
      case 'pcb': {
        const pid = parseInt(parts[1]);
        const b = PM.pcb(pid);
        if(!b){ outLine(' 未找到 PID '+parts[1],'err'); break; }
        outLine(' ┌──── PROCESS CONTROL BLOCK ────┐','ok');
        Object.entries(b).forEach(([k,v])=>outLine(' │ '+k.padEnd(10)+': '+v,'ln'));
        outLine(' └─────────────────────────────┘','ok');
        break;
      }
      case 'block': outLine(' '+PM.block(parseInt(parts[1])),'ok'); break;
      case 'wake': outLine(' '+PM.wake(parseInt(parts[1])),'ok'); break;
      case 'kill': {
        const pid=parseInt(parts[1]);
        let target=null; WM.windows.forEach((w)=>{ if(w.pid===pid) target=w; });
        if(target){ const id=[...WM.windows.entries()].find(e=>e[1]===target)[0]; WM.close(id); outLine(' 已终止进程 '+pid,'ok'); }
        else outLine(' 未找到 PID '+pid,'err');
        break;
      }
      case 'exit':
        WM.close(yip);
        outLine(' 已退出终端','ok');
        return;
      case 'restart': outLine(' 模拟系统重启…','warn'); setTimeout(()=>location.reload(),800); break;
      case 'sudo': outLine(' 权限不足（demo 模式）','err'); break;
      default: outLine(' zsh: command not found: '+parts[0]+'  (输入 help 查看)','err');
    }
  }
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ runCmd(input.value); input.value=''; }
    else if(e.key==='ArrowUp'){ if(hIdx>0){hIdx--;input.value=history[hIdx];} e.preventDefault(); }
    else if(e.key==='ArrowDown'){ if(hIdx<history.length-1){hIdx++;input.value=history[hIdx];} else {hIdx=history.length;input.value='';} e.preventDefault(); }
    else if(e.key==='l' && e.ctrlKey){ out.innerHTML=''; e.preventDefault(); }
  });
  outLine(' Last login: '+new Date().toString()+' on console','ln');
  outLine(' Welcome to macOS Terminal Demo — '+USER.full+' ('+USER.name+')','ok');
  outLine(' 当前目录: '+currentPath+'   （mkdir / cd / cat / echo > 均真实生效）','ln');
  outLine(' 已载入默认文件: note.txt （内容：'+virtualFS['note.txt']+'）','ln');
  outLine(' 输入 help 查看可用命令','ln');
  input.focus();
  out.addEventListener('click',()=>input.focus());
}
function buildTermWin(body, wm, yip, proc){
  const root = el('div',{class:'term-w98'});
  const menu = el('div',{class:'menu-w'},
    el('span',{onclick:()=>showTip('文件菜单')},'文件'),
    el('span',{onclick:()=>showTip('编辑菜单')},'编辑'),
    el('span',{onclick:()=>showTip('查看菜单')},'查看'),
    el('span',{onclick:()=>showTip('帮助菜单')},'帮助')
  );
  const out = el('div',{class:'term-body-w'});
  const promptEl = el('span',{class:'prompt'},USER.name+'@'+USER.winHost+' C:\\WINDOWS>');
  const inp = el('div',{class:'term-input-w'},
    promptEl,
    el('input',{type:'text',autocomplete:'off',spellcheck:false})
  );
  root.append(out, inp);
  body.appendChild(root);
  const wi = inp.querySelector('input');
  let history=[], hIdx=-1;
  /* ★ 真实当前路径：内部 C:/WINDOWS，展示 C:\WINDOWS */
  let currentPath = vfsNorm('C:/WINDOWS');
  function updPrompt(){
    promptEl.textContent = USER.name+'@'+USER.winHost+' '+vfsShow('win',currentPath)+'>';
  }
  updPrompt();
  function outLine(txt,cls=''){ const ln=el('div',{class:'ln'+(cls?' '+cls:'')},txt); out.appendChild(ln); out.scrollTop=out.scrollHeight; }
  function run(cmd){
    window._termActive = Date.now();
    cmd=cmd.trim(); outLine(promptEl.textContent+cmd,'cmd');
    if(!cmd) return;
    history.push(cmd); hIdx=history.length;
    const parts=cmd.split(/\s+/);
    const c0=parts[0].toLowerCase();
    switch(c0){
        case 'help': case '?':
          outLine('可用命令：','ok');
          outLine('  DIR [路径]        - 列出目录内容（真实 VFS）','ln');
          outLine('  CD <路径>         - 切换目录，支持 .. 与盘符 C:','ln');
          outLine('  MD|MKDIR <目录名> - 创建目录（写入 virtualFS）','ln');
          outLine('  TYPE <文件名>     - 显示文件内容（读取 virtualFS）','ln');
          outLine('  ECHO 文本 > 文件  - 写入文件，>> 为追加写入','ln');
          outLine('  CLS, VER, DATE, TIME, WHOAMI, HISTORY, EXIT','ln');
          outLine('  OPEN <a>  打开应用 (finder|paint|pcb|computer|calc|mine|game|term)','ln');
          outLine('  PS [ALL], PCB <pid>, BLOCK <pid>, WAKE <pid>, KILL <pid>','ln');
          outLine('  MODE MANUAL|LIVE, STEP, THEME MACOS|WIN98, RESTART','ln');
          break;
        case 'cls': out.innerHTML=''; break;
        case 'dir': {
          const arg = (parts.length>1 && parts[1].toLowerCase()!=='/w') ? parts.slice(1).join(' ') : '';
          const target = vfsResolve('win', currentPath, arg);
          const r = vfsList('win', target);
          if(!r){ outLine(' 无效的目录 - '+arg,'err'); break; }
          if(r.file){ outLine(' '+r.node.name,'ln'); break; }
          outLine(' 驱动器 C 中的卷是 MS-DOS_6','ln');
          outLine(' 卷的序列号是 1A2B-3C4D','ln');
          outLine('','ln');
          outLine(' '+vfsShow('win',target)+' 的目录','ln');
          outLine('','ln');
          r.dirs.forEach(n=>outLine(' '+(n.name+'/').padEnd(16)+'<DIR>','ln'));
          r.files.forEach(n=>outLine(' '+n.name.padEnd(16)+String(n.content.length).padStart(7)+' 字节','ln'));
          outLine('              '+String(r.files.length).padStart(4)+' 个文件','ln');
          outLine('              '+String(r.dirs.length).padStart(4)+' 个目录','ln');
          break;
        }
        case 'cd': {
          const arg = parts.slice(1).join(' ');
          if(!arg){ outLine(' '+vfsShow('win',currentPath),'ln'); break; }
          const target = vfsResolve('win', currentPath, arg);
          const n = vfsGet('win', target);
          if(!n){ outLine(' 无效的目录 - '+arg,'err'); break; }
          if(n.type!=='dir'){ outLine(' '+arg+' 不是目录','err'); break; }
          currentPath = target; updPrompt();
          break;
        }
        case 'md': case 'mkdir': {
          const arg = parts.slice(1).join(' ');
          if(!arg){ outLine(' 用法: MD <目录名>','warn'); break; }
          const r = vfsMkdir('win', vfsResolve('win', currentPath, arg));
          outLine(' '+r.msg, r.ok?'ok':'err');
          break;
        }
        case 'type': {
          const arg = parts.slice(1).join(' ');
          if(!arg){ outLine(' 用法: TYPE <文件名>','warn'); break; }
          const n = vfsGet('win', vfsResolve('win', currentPath, arg));
          if(!n){ outLine(' 找不到文件 - '+arg,'err'); break; }
          if(n.type==='dir'){ outLine(' '+arg+' 是目录，无法 TYPE','err'); break; }
          if(!n.content){ outLine(' （'+vfsShow('win',vfsResolve('win',currentPath,arg))+' 是空文件）','warn'); break; }
          n.content.split('\n').forEach(l=>outLine(' '+l,'ln'));
          break;
        }
        case 'echo': {
          const rd = splitRedirect(cmd);
          if(rd){
            const text = rd.body.replace(/^echo\s*/i,'').replace(/^"([\s\S]*)"$/, '$1');
            const target = vfsResolve('win', currentPath, rd.file);
            const oldN = vfsGet('win', target);
            const old = rd.append ? ((oldN && oldN.type==='file' && oldN.content) || '') : '';
            const r = vfsWrite('win', target, old + text);
            outLine(' '+r.msg, r.ok?'ok':'err');
          } else outLine(' '+cmd.replace(/^echo\s*/i,''),'ln');
          break;
        }
        case 'date': case 'time': outLine(' '+new Date().toString(),'ln'); break;
        case 'ver': outLine(' Windows 98 [Version 4.10.1998]','ok'); break;
        case 'whoami': outLine(' '+WHOAMI(),'ok'); break;
        case 'apps': outLine(' 已安装: FINDER, PCB, CALC, MINE, TERM','ln'); break;
        case 'history':
          history.forEach((h,i)=>outLine(' '+String(i+1).padStart(3,' ')+'  '+h,'ln'));
          if(!history.length) outLine(' (空)','warn');
          break;
        case 'open': {
          const app=parts[1];
          const alias={draw:'paint',game:'mine',computer:'calc'};
          const real=alias[app]||app;
          if(['finder','pcb','calc','mine','term','paint'].includes(real)){ window.WM.open(real); outLine(' 已打开 '+real,'ok'); }
          else outLine(' 错误: 未找到 '+app+' (可用: finder|paint|pcb|computer|calc|mine|game|term|draw)','err');
          break;
        }
        case 'mode': {
          const m=parts[1]==='manual'?'manual':(parts[1]==='live'?'live':null);
          if(!m){ outLine(' 用法: MODE MANUAL|LIVE','warn'); break; }
          outLine(' '+PM.setMode(m),'ok'); break;
        }
        case 'step': outLine(' '+PM.step(),'ok'); break;
        case 'ps': {
          outLine(' PID  TYPE       TITLE                     STATE    MEM    CPU_MS  CPU%','ok');
          PM.psList().forEach(p=>{
            outLine(` ${String(p.pid).padEnd(4)} ${p.type.padEnd(10)} ${p.title.padEnd(24).slice(0,24)} ${p.status.padEnd(8)} ${String(p.memKB).padEnd(5)}KB ${String(p.cpuMs).padEnd(6)}ms ${PM.cpuPct.toFixed(1)}%`,'ln');
          });
          if(!PM.psList().length) outLine(' (空)','warn');
          if(parts[1] && parts[1].toLowerCase()==='all') outLine(`总内存: ${PM.totalMem()}KB  模式: ${PM.mode}  系统CPU%: ${PM.cpuPct.toFixed(1)}`,'ln');
          break;
        }
        case 'pcb': {
          const b=PM.pcb(parseInt(parts[1]));
          if(!b){ outLine(' 未找到 PID '+parts[1],'err'); break; }
          outLine(' ┌──── PROCESS CONTROL BLOCK ────┐','ok');
          Object.entries(b).forEach(([k,v])=>outLine(' │ '+k.padEnd(10)+': '+v,'ln'));
          outLine(' └─────────────────────────────┘','ok');
          break;
        }
        case 'block': outLine(' '+PM.block(parseInt(parts[1])),'ok'); break;
        case 'wake': outLine(' '+PM.wake(parseInt(parts[1])),'ok'); break;
        case 'kill': {
          const pid=parseInt(parts[1]); let target=null;
          WM.windows.forEach((w)=>{ if(w.pid===pid) target=w; });
          if(target){ const id=[...WM.windows.entries()].find(e=>e[1]===target)[0]; WM.close(id); outLine(' 已终止 '+pid,'ok'); }
          else outLine(' 未找到 PID '+pid,'err');
          break;
        }
        case 'theme':
          if(parts[1]==='macos'||parts[1]==='m'){ switchOS('macos'); outLine(' 已切换 macOS','ok'); }
          else if(parts[1]==='win98'||parts[1]==='w'){ switchOS('win98'); outLine(' 已切换 Windows 98','ok'); }
          else outLine(' 用法: THEME [MACOS|WIN98]','warn');
          break;
        case 'exit':
          WM.close(yip);
          return;
        case 'restart': outLine(' 模拟系统重启…','warn'); setTimeout(()=>location.reload(),800); break;
        default: outLine(' 错误的命令或文件名: '+parts[0]+'  (输入 HELP)','err');
      }
  }
  wi.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ run(wi.value); wi.value=''; }
    else if(e.key==='ArrowUp'){ if(hIdx>0){hIdx--;wi.value=history[hIdx];} e.preventDefault(); }
    else if(e.key==='ArrowDown'){ if(hIdx<history.length-1){hIdx++;wi.value=history[hIdx];} else {hIdx=history.length;wi.value='';} e.preventDefault(); }
  });
  outLine('Microsoft(R) MS-DOS(R) Version 6.22','ok');
  outLine('(C)Copyright Microsoft Corp 1981-1994.','help');
  outLine(' 当前用户: '+USER.name+'@'+USER.winHost+'  主目录: '+USER.winHome,'ln');
  outLine(' 当前目录: '+vfsShow('win',currentPath)+'   （MD / CD / TYPE / ECHO > 均真实生效）','ln');
  outLine('  输入 HELP 查看命令','ln');
  wi.focus();
  out.addEventListener('click',()=>wi.focus());
}

    {n:'扫雷',         i:'i-w98-mine',       x:110, y:130, app:'mine'},
    {n:'画图',         i:'i-w98-paint',      x:110, y:240, app:'paint'},
    {n:'回收站',       i:'i-w98-recycle',    x:200, y:20,  app:'recycle'},
    {n:'MS-DOS',       i:'i-w98-bat',        x:200, y:130, app:'term'},
    {n:'README',       i:'i-w98-txt',        x:200, y:240},
  ];
  // 统一桌面图标启动逻辑
  function openW98DesktopApp(w){
    if(w.app==='finder') WM.open('finder', {path: w.path || ''});
    else if(w.app==='pcb') WM.open('pcb');
    else if(w.app==='mine') WM.open('mine');
    else if(w.app==='term') WM.open('term');
    else if(w.app==='paint') WM.open('paint');
    else if(w.app==='mini-calc') WM.open('calc');
    else if(w.app==='recycle') showDialog('w98','回收站','回收站是空的。\n没有需要恢复的文件。',[{label:'确定',primary:true,action:()=>closeDialog()}]);
    else showDialog('w98', w.n, '功能开发中：打开 '+w.n, [{label:'确定',primary:true,action:()=>closeDialog()}]);
  }
  // 桌面空白点击清空选中
  $('#win98-desktop').addEventListener('click', (e)=>{
    if(e.target.id==='win98-desktop' || e.target.id==='w98-desktop-icons'){
      $$('#w98-desktop-icons .win98-icon').forEach(x=>x.classList.remove('selected'));
    }
  });
  // macOS 桌面空白点击清空选中
  $('#macos-desktop').addEventListener('click', (e)=>{
    if(e.target.id==='macos-desktop' || e.target.id==='mac-desktop-icons' || e.target.id==='mac-icon-grid' || e.target.classList.contains('mac-icon-grid')){
      $$('.mac-icon').forEach(x=>x.classList.remove('selected'));
    }
  });
  wins.forEach(w=>{
    const ic = document.createElement('div');
    ic.className = 'win98-icon';
    ic.style.cssText = `left:${w.x}px;top:${w.y}px`;
    ic.dataset.app = w.app || '';
    ic.dataset.name = w.n;
    // ★ 自定义单击/双击检测
    let lastClickAt = 0;
    ic.addEventListener('click', (e)=>{
      e.stopPropagation();
      const now = Date.now();
      if(now - lastClickAt < 350){
        // 自定义双击：清除单击状态，立即打开
        lastClickAt = 0;
        console.log('[icon] win98 dblclick:', w.n, '→', w.app, w.path||'');
        try { openW98DesktopApp(w); showTip('正在打开：'+w.n); }
        catch(err){ console.error(err); showTip('打开失败：'+err.message); }
      } else {
        // 单击：选中
        lastClickAt = now;
        $$('#w98-desktop-icons .win98-icon').forEach(x=>x.classList.remove('selected'));
        ic.classList.add('selected');
      }
    });
    const img = document.createElement('div');
    img.className = 'win98-icon-img';
    img.innerHTML = `<svg width="32" height="32"><use href="#${w.i}"/></svg>`;
    const lbl = document.createElement('div');
    lbl.className = 'win98-icon-label';
    lbl.textContent = w.n;
    ic.appendChild(img);
    ic.appendChild(lbl);
    desk.appendChild(ic);
  });
  $('#w98-start-btn').onclick = (e)=>{
    e.stopPropagation();
    $('#start-menu').classList.toggle('open');
  };
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('#start-menu') && !e.target.closest('#w98-start-btn')){
      $('#start-menu').classList.remove('open');
    }
  });
  $$('#start-menu .sm-item').forEach(item=>{
    item.onclick = ()=>{
      const app = item.dataset.app;
      const action = item.dataset.menuAction;
      $('#start-menu').classList.remove('open');
      if(app){
        if(app==='finder') WM.open('finder');
        else if(app==='pcb') WM.open('pcb');
        else if(app==='mine') WM.open('mine');
        else if(app==='term') WM.open('term');
        else if(app==='calc') WM.open('calc');
      } else if(action==='settings'){
        showDialog('w98','设置','Windows 98 控制面板 - 功能开发中',[{label:'确定',primary:true,action:()=>closeDialog()}]);
      } else if(action==='about'){
        showDialog('w98','关于 Windows 98','Windows 98 仿真版 v1.0\n单页面 Web 应用\n开发者：陈艳娇',[{label:'确定',primary:true,action:()=>closeDialog()}]);
      } else if(action==='switch'){
        switchOS('macos');
      }
    };
  });
  // Win98 double click detection for icons (desktop)
  let lastClick = null;
  $$('#w98-desktop-icons .win98-icon').forEach(ic=>{
    let t = null;
    ic.addEventListener('click', ()=>{
      $$('#w98-desktop-icons .win98-icon').forEach(x=>x.classList.remove('selected'));
      ic.classList.add('selected');
    });
  });
}

/* ----- Dropdown menus ----- */
let curDropdown=null;
function showDropdown(items, evt){
  closeDropdown();
  const menu = el('div',{class:'mac-dropdown'});
  items.forEach(it=>{
    if(it.sep){ menu.appendChild(el('div',{class:'dd-sep'})); return; }
    const d = el('div',{class:'dd-item'+(it.disabled?' disabled':'')},
      el('span',{},it.label),
      it.shortcut?el('span',{class:'dd-shortcut'},it.shortcut):null
    );
    if(it.action) d.onclick = ()=>{ closeDropdown(); it.action(); };
    menu.appendChild(d);
  });
  document.body.appendChild(menu);
  const r = evt.currentTarget.getBoundingClientRect();
  menu.style.left = r.left+'px';
  menu.style.top = (r.bottom+2)+'px';
  curDropdown = menu;
  setTimeout(()=>{
    document.addEventListener('click', closeDropdownOnce, {once:true});
  }, 0);
}
function closeDropdown(){ if(curDropdown){curDropdown.remove();curDropdown=null;} }
function closeDropdownOnce(){ closeDropdown(); }
/* Dialog */
function showDialog(style, title, msg, btns){
  const o = $('#dialog-overlay');
  o.innerHTML='';
  let dlg;
  if(style==='mac'){
    dlg = el('div',{class:'mac-dialog'},
      el('h3',{},title),
      el('p',{},msg),
      el('div',{class:'actions'},
        ...(btns||[{label:'好',primary:true}]).map(b=>{
          return el('button',{class:b.primary?'':'secondary', onclick:()=>{ closeDialog(); b.action&&b.action(); }}, b.label||'确定');
        })
      )
    );
    if(!btns){
      dlg.querySelector('.actions').appendChild(el('button',{onclick:closeDialog},'好'));
    }
  } else {
    dlg = el('div',{class:'w98-dialog'},
      el('div',{class:'title'},
        el('span',{},title),
        el('span',{class:'x',onclick:closeDialog},'r'),
      ),
      el('div',{class:'body'}, msg),
      el('div',{class:'actions'},
        ...(btns||[{label:'确定',primary:true}]).map(b=>{
          return el('button',{onclick:()=>{ closeDialog(); b.action&&b.action(); }}, b.label||'确定');
        })
      )
    );
  }
  o.appendChild(dlg);
  o.classList.add('open');
}
function closeDialog(){ $('#dialog-overlay').classList.remove('open'); $('#dialog-overlay').innerHTML=''; }

/* ----- OS switching ----- */
function switchOS(os){
  currentOS = os;
  $$('.desktop').forEach(d=>d.classList.remove('active'));
  $('#'+os+'-desktop').classList.add('active');
  $$('#os-switcher .tab').forEach(t=>t.classList.toggle('active', t.dataset.os===os));
  // 双系统独立: 切换系统时暂停未显示桌面的自动演示，避免 CPU 累积
  // 通过 ProcessManager 的 mode 切换实现：manual 冻结 tick（保留 cpuMs/memKB），
  // 切回原 OS 时再次恢复 live。
  if(os==='win98'){ PM.setMode('manual'); PM._pausedByOS = true; }
  else if(os==='macos'){ PM.setMode('live'); PM._pausedByOS = false; }
  showTip('已切换到 '+(os==='macos'?'macOS':'Windows 98')+' 桌面');
}
/* 浏览器标签页隐藏时也暂停演示 */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ PM.setMode('manual'); PM._pausedByVisibility = true; }
  else { if(!PM._pausedByOS) PM.setMode('live'); PM._pausedByVisibility = false; }
});
$$('#os-switcher .tab').forEach(t=>{
  t.onclick = ()=>switchOS(t.dataset.os);
});

/* ----- Boot ----- */
initMac();
initWin98();
